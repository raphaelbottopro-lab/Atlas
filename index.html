<meta name="theme-color" content="#040B15">
<title>ATLAS</title>
<style>
:root{
  --bg:#F4F4F1; --card:#FFFFFF; --tx:#191A1C; --sub:#82838A; --line:#E7E7E3;
  --acc:#FF5A1F; --ok:#1D9E75; --warn:#EF9F27; --danger:#E24A3B;
  --sil:#C9C9C4; --chip:#F0F0EC;
  --sh:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101113; --card:#1B1C1F; --tx:#F2F2F0; --sub:#8E8F96; --line:#2A2B2F;
    --sil:#3C3D42; --chip:#26272B;
    --sh:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
#view{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:6px 2px 2px}
.subh{color:var(--sub);font-size:14px;margin:0 2px 16px;text-transform:capitalize}
.brand{display:flex;align-items:center;gap:11px;margin:4px 2px 2px}
.brand img{width:44px;height:54px;object-fit:contain;flex-shrink:0}
.brand h1{margin:0;letter-spacing:.14em;font-size:26px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.card-t{font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.sec-t{font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin:22px 4px 8px}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:none}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.it-name{font-weight:600}
.it-sub{font-size:13px;color:var(--sub)}
.chev{color:var(--sub);flex-shrink:0}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--sub)}
.badge.done{background:rgba(29,158,117,.15);color:var(--ok)}
button{font-family:inherit;border:none;cursor:pointer}
.btn{width:100%;padding:14px;border-radius:14px;font-size:16px;font-weight:700;background:var(--acc);color:#fff;margin-top:10px}
.btn.sec{background:var(--chip);color:var(--tx)}
.btn.dgr{background:transparent;color:var(--danger);font-weight:600}
.btn.sm{width:auto;padding:8px 14px;font-size:14px;margin-top:0}
/* tabbar */
#tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);z-index:50}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;color:var(--sub);font-size:11px;font-weight:600}
.tab.on{color:var(--acc)}
.tab svg{width:26px;height:26px}
.tab .emo{font-size:22px;line-height:26px;height:26px;display:block;filter:grayscale(1);opacity:.55}
.tab.on .emo{filter:none;opacity:1}
/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:100}
#sheetWrap.hidden{display:none}
#backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 22px);animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sh-t{font-size:20px;font-weight:800;margin:2px 0 14px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--sub);margin:14px 2px 6px}
input.f,select.f,textarea.f{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;font-family:inherit}
textarea.f{resize:vertical;min-height:70px}
.frow{display:flex;gap:10px}.frow>div{flex:1}
/* calendrier */
.seg{display:flex;background:var(--chip);border-radius:11px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:7px;border-radius:9px;background:none;font-size:14px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.cal-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-nav .ttl{flex:1;font-size:17px;font-weight:700;text-transform:capitalize}
.nav-b{width:34px;height:34px;border-radius:50%;background:var(--chip);color:var(--tx);font-size:17px;font-weight:700}
.today-b{padding:7px 12px;border-radius:99px;background:var(--chip);color:var(--acc);font-size:13px;font-weight:700}
.wday{background:var(--card);border-radius:16px;box-shadow:var(--sh);margin-bottom:10px;padding:10px 14px}
.wday.today{outline:2px solid var(--acc)}
.wday-h{display:flex;align-items:baseline;gap:8px;padding:4px 0}
.wday-h .dn{font-weight:800;text-transform:capitalize}
.wday-h .dd{color:var(--sub);font-size:13px}
.sess{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.sess .t{font-size:13px;color:var(--sub);width:44px;flex-shrink:0}
.sess .n{font-weight:600}
.empty{color:var(--sub);font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mwd{text-align:center;font-size:11px;font-weight:700;color:var(--sub);padding:4px 0}
.mday{aspect-ratio:1;border-radius:12px;background:var(--card);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size:14px;font-weight:600}
.mday.out{opacity:.28;box-shadow:none;background:transparent}
.mday.tod{outline:2px solid var(--acc)}
.mdots{display:flex;gap:2px;height:5px}
.mdots i{width:5px;height:5px;border-radius:50%}
.ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ymon{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:12px 8px;text-align:center;cursor:pointer}
.ymon .n{font-weight:700;text-transform:capitalize;font-size:14px}
.ymon .c{font-size:12px;color:var(--sub);margin-top:4px}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 84px);width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;font-size:30px;font-weight:400;box-shadow:0 6px 18px rgba(255,90,31,.4);z-index:40;line-height:0}
/* donut */
.donut-wrap{display:flex;align-items:center;gap:18px}
.donut-pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-pct b{font-size:26px;letter-spacing:-.02em}
.donut-pct span{font-size:11px;color:var(--sub)}
.leg-row{display:flex;align-items:center;gap:8px;font-size:14px;padding:3px 0}
.leg-row b{margin-left:auto;font-variant-numeric:tabular-nums}
/* exo dans séance */
.exo-l{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.exo-l:last-child{border:none}
.exo-l .nm{font-weight:600}
.exo-l .zz{font-size:12px;color:var(--sub)}
.exo-l .sr{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
/* palette */
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:8px 0}
.pal button{aspect-ratio:1;border-radius:50%;border:3px solid transparent}
.pal button.on{border-color:var(--tx)}
.cbtn{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);width:100%;color:var(--tx);font-size:16px}
/* records */
.rec-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rec-row:last-child{border:none}
.rec-row .d{font-weight:700;width:80px}
.rec-row .t{font-variant-numeric:tabular-nums;font-weight:700;margin-left:auto}
.rec-row .dt{font-size:12px;color:var(--sub)}
.feel{display:flex;gap:8px;justify-content:space-between;margin-top:4px}
.feel button{flex:1;font-size:24px;padding:8px 0;border-radius:12px;background:var(--chip);opacity:.45}
.feel button.on{opacity:1;outline:2px solid var(--acc)}
.loghead{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 100px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:200;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
.ocr-load{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:14px;padding:8px 0}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hint{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.4}
.tab svg{width:24px}
.kpi{display:flex;gap:8px;margin-bottom:14px}
.kpi>div{flex:1;background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:11px 10px;text-align:center;cursor:pointer}
.kpi .k{font-size:10px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .u{font-size:11px;color:var(--sub)}
.gauge{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;margin-top:8px}
.gauge i{display:block;height:8px;border-radius:4px;background:var(--acc);transition:width .4s}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:4px}
.pgrid .ph{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--chip);cursor:pointer}
.pgrid .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid .ph span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:9.5px;font-weight:600;padding:10px 4px 3px;text-align:center}
.pgrid .ph.sel{outline:3px solid var(--acc);outline-offset:-3px}
.cmp{display:flex;gap:8px}
.cmp>div{flex:1;text-align:center}
.cmp img{width:100%;border-radius:10px;display:block}
.cmp .cl{font-size:11px;color:var(--sub);margin-top:4px}
.suppl{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.suppl:last-child{border:none}
.ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;color:transparent}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.qa{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.qa button{flex:1;min-width:60px;padding:9px 4px;border-radius:11px;background:var(--chip);color:var(--tx);font-size:13px;font-weight:700}
.tab{font-size:10px}
.bigv{font-size:29px;font-weight:800;letter-spacing:-.025em;font-variant-numeric:tabular-nums}
.bigv small{font-size:14px;color:var(--sub);font-weight:600}
.delta{font-size:13px;font-weight:700}
.chart{width:100%;display:block;margin-top:10px;overflow:visible}
.xlab{display:flex;margin-top:5px}
.xlab span{flex:1;text-align:center;font-size:9.5px;color:var(--sub)}
.stack{display:flex;height:11px;border-radius:6px;overflow:hidden;margin-top:9px;gap:2px}
.stack i{display:block;border-radius:3px}
.lg{display:flex;gap:12px;margin-top:9px;flex-wrap:wrap}
.lg span{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:5px}
.lg i{width:9px;height:9px;border-radius:3px;display:block}
.zrow{display:flex;align-items:center;gap:9px;padding:7px 0}
.zrow .zn{font-size:13px;font-weight:600;width:88px;flex-shrink:0}
.zrow .zb{flex:1;height:9px;background:var(--chip);border-radius:5px;overflow:hidden}
.zrow .zb i{display:block;height:9px;border-radius:5px;background:var(--acc)}
.zrow .zv{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;width:52px;text-align:right}
.empty-s{color:var(--sub);font-size:13.5px;line-height:1.5;padding:6px 0}
.quote{font-size:15.5px;line-height:1.5;font-style:italic}
.quote b{display:block;font-style:normal;font-size:12px;color:var(--sub);margin-top:8px;font-weight:600}
.bdg{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:4px}
.bdg>div{text-align:center;opacity:.28}
.bdg>div.on{opacity:1}
.bdg .e{font-size:25px;line-height:1.25}
.bdg .l{font-size:9px;color:var(--sub);font-weight:600;line-height:1.2}
.warn-c{background:linear-gradient(140deg,#3A2418,var(--card))}
.ord{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:7px}
.ord .nm2{flex:1;font-size:14px;font-weight:600}
.ord button{width:32px;height:32px;border-radius:9px;background:var(--chip);color:var(--tx);font-size:14px;font-weight:700}
.ord.off{opacity:.45}
.sw{width:46px;height:27px;border-radius:99px;background:var(--chip);position:relative;flex-shrink:0;cursor:pointer}
.sw i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.18s}
.sw.on{background:var(--ok)}.sw.on i{left:22px}
#restChip{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 84px);
  background:var(--card);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.35);
  display:flex;align-items:center;gap:10px;padding:11px 14px;z-index:60;overflow:hidden}
#restChip .rc-bar{position:absolute;left:0;top:0;bottom:0;background:rgba(255,90,31,.16);transition:width 1s linear}
#restChip .rc-t{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;position:relative;flex:1}
#restChip button{position:relative;background:var(--chip);color:var(--tx);width:34px;height:34px;border-radius:50%;font-size:15px;font-weight:700}
.hrow{display:flex;gap:8px;margin-bottom:12px}
.hrow button{flex:1;padding:10px;border-radius:12px;background:var(--chip);color:var(--tx);font-size:13px;font-weight:700}
</style>
</head>

/* --- IndexedDB : stockage local sans limite pratique --- */
const DBN='atlas_db',STORE='kv';
let _db=null;
function idb(){ return _db?Promise.resolve(_db):new Promise((res,rej)=>{
  const r=indexedDB.open(DBN,1);
  r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE); };
  r.onsuccess=()=>{_db=r.result;res(_db);}; r.onerror=()=>rej(r.error); }); }
function idbGet(k){ return idb().then(db=>new Promise((res,rej)=>{
  const q=db.transaction(STORE,'readonly').objectStore(STORE).get(k);
  q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); })); }
function idbSet(k,v){ return idb().then(db=>new Promise((res,rej)=>{
  const t=db.transaction(STORE,'readwrite'); t.objectStore(STORE).put(v,k);
  t.oncomplete=()=>res(true); t.onerror=()=>rej(t.error); })); }

function parseHMS(s){ if(!s)return null; const p=String(s).trim().split(':').map(Number); if(!p.length||p.some(isNaN))return null; if(p.length===3)return p[0]*3600+p[1]*60+p[2]; if(p.length===2)return p[0]*60+p[1]; return p[0]; }
function fmtHMS(t){ if(t==null)return '—'; t=Math.round(t); const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60; return h?`${h}:${D2(m)}:${D2(s)}`:`${m}:${D2(s)}`; }
function fmtPace(sec){ if(!sec||!isFinite(sec))return '—'; const m=Math.floor(sec/60),s=Math.round(sec%60); return `${m}:${D2(s)} /km`; }

/* ============ SÉANCES / OCCURRENCES ============ */
function occ(type,src,date){ return {type,id:src.id,date,time:src.time||'',sportId:src.sportId,templateId:src.templateId||null,label:src.label||(tplById(src.templateId)?tplById(src.templateId).name:(sport(src.sportId)?.name||'Séance'))}; }
function sessionsForDate(s){
  const d=fromISO(s),wd=dow(d),out=[];
  state.recurring.forEach(r=>{ if(r.dow===wd && !state.skips.find(k=>k.ruleId===r.id&&k.date===s)) out.push(occ('rule',r,s)); });
  state.oneoffs.filter(o=>o.date===s).forEach(o=>out.push(occ('one',o,s)));
  out.sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
  return out;
}
function findLog(o){ return state.logs.find(l=>l.refType===o.type&&l.refId===o.id&&l.date===o.date); }
function weekStats(ref){
  const m=monday(ref||new Date()); let done=0,tot=0; const bySport={};
  for(let i=0;i<7;i++){ const s=iso(addD(m,i));
    sessionsForDate(s).forEach(o=>{ tot++; const sid=o.sportId; bySport[sid]=bySport[sid]||{done:0,tot:0}; bySport[sid].tot++;
      if(findLog(o)){done++;bySport[sid].done++;} });
  }
  return {done,tot,bySport,monday:m};
}
function nextSession(){
  const now=new Date(); const todayS=todayISO(); const nowT=`${D2(now.getHours())}:${D2(now.getMinutes())}`;
  for(let i=0;i<60;i++){ const s=iso(addD(now,i));
    for(const o of sessionsForDate(s)){ if(findLog(o))continue; if(i===0 && o.time && o.time<nowT)continue; return o; } }
  return null;
}

function donutHTML(pct,legend){
  const r=52,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<div class="donut-wrap">
    <div style="position:relative;width:130px;height:130px;flex-shrink:0">
      <svg width="130" height="130" viewBox="0 0 130 130">
        <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--chip)" stroke-width="13"/>
        <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--acc)" stroke-width="13" stroke-linecap="round"
          stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 65 65)"/>
      </svg>
      <div class="donut-pct"><b>${pct}%</b><span>semaine</span></div>
    </div>
    <div class="grow">${legend}</div>
  </div>`;
}

/* --- Cartes --- */
function cWeek(){
  const ws=weekStats(new Date());
  const pct=ws.tot?Math.round(ws.done/ws.tot*100):0;
  let legend=`<div style="font-weight:700;margin-bottom:6px">${ws.done} / ${ws.tot} séance${ws.tot>1?'s':''}</div>`;
  const sids=Object.keys(ws.bySport);
  legend+=sids.length?sids.map(sid=>{const sp=sport(sid),b=ws.bySport[sid];
    return `<div class="leg-row"><span class="dot" style="background:${sp?.color||'#999'}"></span>${esc(sp?.name||'?')}<b>${b.done}/${b.tot}</b></div>`;}).join('')
    :`<div class="it-sub">Aucune séance prévue cette semaine.<br>Ajoute-les dans le calendrier.</div>`;
  return `<div class="card"><div class="card-t">Accomplissement de la semaine</div>${donutHTML(pct,legend)}</div>`;
}
function cNext(){
  const nx=nextSession();
  let h;
  if(nx){ const sp=sport(nx.sportId); const isToday=nx.date===todayISO();
    h=`<div class="item" onclick="openSession('${nx.type}','${nx.id}','${nx.date}')">
      <span class="dot" style="background:${sp?.color}"></span>
      <div class="grow"><div class="it-name">${esc(nx.label)}</div>
      <div class="it-sub">${isToday?"Aujourd'hui":fmtLong(nx.date)}${nx.time?' · '+nx.time:''} · ${esc(sp?.name||'')}</div></div>
      <span class="chev">›</span></div>`;
  } else h=`<div class="it-sub">Rien de planifié. Ajoute une séance depuis le calendrier ➕</div>`;
  return `<div class="card"><div class="card-t">Prochain entraînement</div>${h}</div>`;
}
function cRecords(){
  const recs=state.records.map(r=>{
    const dl=`${String(r.dist).replace('.',',')} km`;
    const meta=[dl!==r.label?dl:'',r.date?fmtLong(r.date):''].filter(Boolean).join(' · ');
    return `<div class="rec-row"><span class="d">${esc(r.label)}</span>
      <span class="dt">${meta}</span><span class="t">${fmtHMS(r.time)}</span></div>`;}).join('');
  return `<div class="card" onclick="editRecords()" style="cursor:pointer"><div class="card-t">🏆 Palmarès running</div>${recs}
    <div class="hint">Mis à jour automatiquement après tes sorties. Touche la carte pour modifier.</div></div>`;
}
function cRecovery(){
  const n=daysSinceRest(), rest=lastRestDay(), today=n>0;
  const alert=today&&n>=5;
  const main=today?`${n} <small>jour${n>1?'s':''} d'affilée</small>`:`<small>Repos aujourd'hui</small>`;
  let sub;
  if(!today){ let ls=null;
    for(let i=1;i<=90;i++){ if(state.logs.some(l=>l.date===iso(addD(new Date(),-i)))){ls=i;break;} }
    sub=ls===1?'Séance hier':ls?`Dernière séance il y a ${ls} jours`:'Aucune séance récente';
  } else sub=rest===null?'Aucun repos sur les 60 derniers jours':`Dernier repos il y a ${n} jour${n>1?'s':''}`;
  return `<div class="card ${alert?'warn-c':''}"><div class="card-t">${alert?'⚠️':'🌙'} Récupération</div>
    <div class="bigv" style="font-size:24px">${main}</div>
    ${sub?`<div class="it-sub">${sub}</div>`:''}
    ${alert?`<div class="hint" style="color:var(--acc)">Tu enchaînes depuis ${n} jours. Une journée de repos t'aidera plus qu'une séance de plus — c'est au repos que le muscle se construit.</div>`:''}</div>`;
}

    <div class="it-sub">${s?'Au moins une séance chaque semaine.':'Fais une séance cette semaine pour lancer la série.'}</div></div>`;
}
function cQuote(){
  const [q,src]=quoteOfDay();
  return `<div class="card warn-c"><div class="card-t">🎬 La phrase du jour</div>
    <div class="quote">« ${q} »<b>— ${src}</b></div></div>`;
}
function cVolume(){
  const mon=monday(new Date());
  const v=state.logs.filter(l=>l.kind==='muscu'&&l.date>=iso(mon)).reduce((a,l)=>a+logVolume(l),0);
  const pv=state.logs.filter(l=>l.kind==='muscu'&&l.date>=iso(addD(mon,-7))&&l.date<iso(mon)).reduce((a,l)=>a+logVolume(l),0);
  const d=pv?Math.round((v-pv)/pv*100):null;
  return `<div class="card" onclick="go('stats')" style="cursor:pointer"><div class="card-t">🏋️ Volume — cette semaine</div>
    <div class="bigv">${kfmt(v)}</div>
    ${d!==null?`<div class="delta" style="color:${d>=0?'var(--ok)':'var(--warn)'}">${d>=0?'+':''}${d} % vs semaine dernière</div>`:'<div class="it-sub">Première semaine de données</div>'}</div>`;
}
function cKm(){
  const now=new Date(), mk=`${now.getFullYear()}-${D2(now.getMonth()+1)}`;
  const km=state.logs.filter(l=>l.kind==='cardio'&&l.dist&&l.date.startsWith(mk)).reduce((a,l)=>a+l.dist,0);
  return `<div class="card" onclick="go('stats')" style="cursor:pointer"><div class="card-t">📍 Kilomètres — ${MONTHS[now.getMonth()]}</div>
    <div class="bigv">${km.toFixed(1).replace('.',',')} <small>km</small></div></div>`;
}
function cGoal(){
  const g=state.goals;
  const cands=state.logs.filter(l=>l.kind==='cardio'&&isRun(l.sportId)&&l.dist>=g.runDist*0.97&&l.dist<=g.runDist*1.06&&l.timeSec)
    .sort((a,b)=>a.timeSec-b.timeSec);
  const best=cands[0];
  const pct=best?Math.max(0,Math.min(100,g.runTime/best.timeSec*100)):0;
  return `<div class="card" onclick="editGoal()" style="cursor:pointer"><div class="card-t">🎯 Objectif ${g.runDist} km</div>
    <div class="bigv">${best?fmtHMS(best.timeSec):'—'} <small>→ ${fmtHMS(g.runTime)}</small></div>
    <div class="gauge"><i style="width:${pct}%"></i></div>
    <div class="hint">Allure cible ${fmtPace(g.runTime/g.runDist)}</div></div>`;
}
function cSleep(){
  const a=sleepAvg(7), t=state.body.sleep.find(x=>x.date===todayISO());
  return `<div class="card" onclick="addSleep()" style="cursor:pointer"><div class="card-t">😴 Sommeil</div>
    <div class="bigv">${t?`${Math.floor(t.h)} h ${D2(Math.round((t.h%1)*60))}`:'—'}</div>
    <div class="it-sub">${a?`Moyenne 7 jours : ${Math.floor(a)} h ${D2(Math.round((a%1)*60))}`:'Touche pour enregistrer ta nuit'}</div>
    ${a&&a<7?`<div class="hint" style="color:var(--acc)">En prise de masse, viser 7 à 8 h aide autant que l'entraînement.</div>`:''}</div>`;
}
function cFeel(){
  const f=feelAvg(28);
  if(!f)return `<div class="card"><div class="card-t">🙂 Ressenti moyen</div><div class="it-sub">Note tes séances pour voir la tendance.</div></div>`;
  return `<div class="card"><div class="card-t">🙂 Ressenti moyen — 4 semaines</div>
    <div style="font-size:36px;line-height:1.2">${FEELS[Math.round(f.avg)]}</div>
    <div class="it-sub">sur ${f.n} séance${f.n>1?'s':''} notée${f.n>1?'s':''}</div></div>`;
}
function cBadges(){
  const bs=badgeState(), got=bs.filter(b=>b.ok);
  return `<div class="card" onclick="openBadges()" style="cursor:pointer"><div class="card-t">🏅 Badges — ${got.length}/${bs.length}</div>
    <div class="bdg">${bs.slice(0,8).map(b=>`<div class="${b.ok?'on':''}"><div class="e">${b.ok?b.e:'🔒'}</div><div class="l">${b.l}</div></div>`).join('')}</div></div>`;
}
function cMonth(){
  const now=new Date(), mk=`${now.getFullYear()}-${D2(now.getMonth()+1)}`;
  const n=state.logs.filter(l=>l.date.startsWith(mk)).length;
  return `<div class="card" onclick="monthReport(0)" style="cursor:pointer"><div class="card-t">📅 Bilan — ${MONTHS[now.getMonth()]}</div>
    <div class="bigv">${n} <small>séance${n>1?'s':''}</small></div>
    <div class="it-sub">Touche pour le bilan complet</div></div>`;
}
/* --- Personnalisation --- */

  const on=state.dash.filter(id=>CARDS[id]);
  const off=Object.keys(CARDS).filter(id=>!on.includes(id));
  openSheet(`<div class="sh-t">⚙️ Mes cartes</div>
    <div class="it-sub" style="margin:-8px 0 14px">Active, désactive et réordonne les cartes de ton accueil.</div>
    <div class="sec-t">Affichées</div>
    ${on.map((id,i)=>`<div class="ord">
      <button onclick="dashMove(${i},-1)" ${i===0?'disabled style="opacity:.3"':''}>↑</button>
      <button onclick="dashMove(${i},1)" ${i===on.length-1?'disabled style="opacity:.3"':''}>↓</button>
      <span class="nm2">${CARDS[id].l}</span>
      <span class="sw on" onclick="dashToggle('${id}')"><i></i></span></div>`).join('')}
    <div class="sec-t">Masquées</div>
    ${off.length?off.map(id=>`<div class="ord off">
      <span class="nm2">${CARDS[id].l}</span>
      <span class="sw" onclick="dashToggle('${id}')"><i></i></span></div>`).join('')
      :'<div class="it-sub">Toutes les cartes sont affichées.</div>'}

function dashMove(i,d){
  const a=state.dash, j=i+d;
  if(j<0||j>=a.length)return;
  [a[i],a[j]]=[a[j],a[i]];
  save(); editDash(); render();
}
function dashToggle(id){
  const i=state.dash.indexOf(id);
  if(i>=0)state.dash.splice(i,1); else state.dash.push(id);
  save(); editDash(); render();
}
function bodyKPI(){
  const w=lastW(), t=targets(), nt=nutriToday();
  const day=state.body.suppLog[todayISO()]||[], ns=state.body.supps.length;
  return `<div class="kpi">
    <div onclick="go('body')"><div class="k">Poids</div>
      <div class="v">${w?String(w.kg).replace('.',','):'—'}</div><div class="u">kg</div></div>
    <div onclick="go('body')"><div class="k">Protéines</div>
      <div class="v">${nt.prot}</div><div class="u">${t?'/ '+t.prot+' g':'g'}</div></div>
    <div onclick="go('body')"><div class="k">Compléments</div>
      <div class="v">${ns?day.length+'/'+ns:'—'}</div><div class="u">${ns?'pris':'à régler'}</div></div>
  </div>`;
}
function editRecords(){
  tmpRecs=state.records.map(r=>({...r}));
  renderRecForm();
}
function readRecInputs(){
  tmpRecs.forEach((r,i)=>{
    const l=$('#rl_'+i),d=$('#rd_'+i),t=$('#rt_'+i);
    if(l)r.label=l.value; if(d)r.dist=parseFloat(d.value.replace(',','.'))||null;
    if(t)r._t=t.value;
  });
}
function renderRecForm(){
  const rows=tmpRecs.map((r,i)=>`<div class="frow" style="margin-bottom:10px;align-items:center">
    <div style="flex:1.2"><input class="f" id="rl_${i}" value="${esc(r.label)}" placeholder="Nom"></div>
    <div style="flex:0.8"><input class="f" id="rd_${i}" inputmode="decimal" value="${r.dist??''}" placeholder="km"></div>
    <div style="flex:1"><input class="f" id="rt_${i}" placeholder="mm:ss" value="${r._t!==undefined?esc(r._t):(r.time!=null?fmtHMS(r.time):'')}"></div>
    <button class="btn sec sm" style="flex:0 0 auto" onclick="delRec(${i})">✕</button></div>`).join('');
  openSheet(`<div class="sh-t">🏆 Palmarès</div>
    <div class="hint" style="margin:-6px 0 12px">Nom · distance en km · meilleur temps. Une sortie running dont la distance correspond (±) met le record à jour automatiquement.</div>
    ${rows}
    <button class="btn sec" onclick="addRec()">＋ Ajouter une distance</button>
    <button class="btn" onclick="saveRecords()">Enregistrer</button>`);
}
function addRec(){ readRecInputs(); tmpRecs.push({id:'r_'+uid(),label:'',dist:null,time:null,date:null}); renderRecForm(); }
function delRec(i){ readRecInputs(); tmpRecs.splice(i,1); renderRecForm(); }
function saveRecords(){
  readRecInputs();
  state.records=tmpRecs.filter(r=>r.label.trim()).map(r=>{
    const t=r._t!==undefined?r._t.trim():(r.time!=null?fmtHMS(r.time):'');
    const time=t?parseHMS(t):null;
    return {id:r.id,label:r.label.trim(),dist:r.dist,time,date:time===r.time?r.date:null};
  });
  save(); closeSheet(); render(); toast('Palmarès mis à jour');
}

/* ============ CALENDRIER ============ */
function renderCal(){
  let body='';
  if(calMode==='week')body=weekHTML();
  else if(calMode==='month')body=monthHTML();
  else body=yearHTML();
  $('#view').innerHTML=`
    <div class="row" style="margin:6px 2px 2px"><h1 style="flex:1">Calendrier</h1>
      <button class="btn sec sm" onclick="openHistory()">📖 Historique</button></div>
    <div class="subh">&nbsp;</div>
    <div class="seg">
      <button class="${calMode==='week'?'on':''}" onclick="calMode='week';render()">Semaine</button>
      <button class="${calMode==='month'?'on':''}" onclick="calMode='month';render()">Mois</button>
      <button class="${calMode==='year'?'on':''}" onclick="calMode='year';render()">Année</button>
    </div>
    <div class="cal-nav">
      <button class="nav-b" onclick="calShift(-1)">‹</button>
      <div class="ttl">${calTitle()}</div>
      <button class="today-b" onclick="calAnchor=new Date();render()">Aujourd'hui</button>
      <button class="nav-b" onclick="calShift(1)">›</button>
    </div>
    ${body}
    <button class="fab" onclick="addSessionForm('${iso(calAnchor)}')">+</button>`;
}
function calTitle(){
  if(calMode==='week'){ const m=monday(calAnchor),e=addD(m,6);
    return `${m.getDate()} ${m.getMonth()!==e.getMonth()?MSHORT[m.getMonth()]:''} – ${e.getDate()} ${MSHORT[e.getMonth()]} ${e.getFullYear()}`;}
  if(calMode==='month')return `${MONTHS[calAnchor.getMonth()]} ${calAnchor.getFullYear()}`;
  return String(calAnchor.getFullYear());
}
function calShift(n){
  if(calMode==='week')calAnchor=addD(calAnchor,7*n);
  else if(calMode==='month')calAnchor=new Date(calAnchor.getFullYear(),calAnchor.getMonth()+n,1);
  else calAnchor=new Date(calAnchor.getFullYear()+n,calAnchor.getMonth(),1);
  render();
}
function sessLine(o){
  const sp=sport(o.sportId),done=!!findLog(o);
  return `<div class="sess" onclick="openSession('${o.type}','${o.id}','${o.date}')">
    <span class="t">${o.time||'—'}</span><span class="dot" style="background:${sp?.color||'#999'}"></span>
    <span class="n grow">${esc(o.label)}</span>${done?'<span class="badge done">✓ faite</span>':''}</div>`;
}
function weekHTML(){
  const m=monday(calAnchor); let h='';
  for(let i=0;i<7;i++){ const d=addD(m,i),s=iso(d),list=sessionsForDate(s);
    h+=`<div class="wday ${s===todayISO()?'today':''}">
      <div class="wday-h"><span class="dn">${DAYS[i]}</span><span class="dd">${d.getDate()} ${MSHORT[d.getMonth()]}</span>
      <span style="margin-left:auto"><button class="btn sec sm" onclick="addSessionForm('${s}')">＋</button></span></div>
      ${list.length?list.map(sessLine).join(''):'<div class="empty">Repos</div>'}</div>`;
  }
  return h;
}
function monthHTML(){
  const y=calAnchor.getFullYear(),mo=calAnchor.getMonth();
  const first=new Date(y,mo,1),start=monday(first);
  let h='<div class="mgrid">'+DSHORT.map(d=>`<div class="mwd">${d}</div>`).join('');
  for(let i=0;i<42;i++){ const d=addD(start,i); if(i>=35&&d.getMonth()!==mo)break;
    const s=iso(d),list=sessionsForDate(s),out=d.getMonth()!==mo;
    const dots=list.slice(0,3).map(o=>`<i style="background:${sport(o.sportId)?.color||'#999'}"></i>`).join('');
    h+=`<div class="mday ${out?'out':''} ${s===todayISO()?'tod':''}" onclick="openDay('${s}')">${d.getDate()}<span class="mdots">${dots}</span></div>`;
  }
  return h+'</div>';
}
function yearHTML(){
  const y=calAnchor.getFullYear(); let h='<div class="ygrid">';
  for(let mo=0;mo<12;mo++){ let done=0,tot=0;
    const days=new Date(y,mo+1,0).getDate();
    for(let d=1;d<=days;d++){ const list=sessionsForDate(iso(new Date(y,mo,d))); tot+=list.length; list.forEach(o=>{if(findLog(o))done++;}); }
    h+=`<div class="ymon" onclick="calAnchor=new Date(${y},${mo},1);calMode='month';render()">
      <div class="n">${MSHORT[mo]}</div><div class="c">${tot?done+'/'+tot:'—'}</div></div>`;
  }
  return h+'</div>';
}
function openDay(s){
  const list=sessionsForDate(s);
  openSheet(`<div class="sh-t" style="text-transform:capitalize">${fmtLong(s)}</div>
    ${list.length?list.map(sessLine).join(''):'<div class="it-sub">Aucune séance ce jour.</div>'}
    <button class="btn" onclick="addSessionForm('${s}')">＋ Ajouter une séance</button>`);
}

/* ============ FICHE SÉANCE ============ */
function openSession(type,id,date){
  const src=type==='rule'?state.recurring.find(r=>r.id===id):state.oneoffs.find(o=>o.id===id);
  if(!src)return;
  const o=occ(type,src,date),sp=sport(o.sportId),log=findLog(o),tp=tplById(o.templateId);
  let content='';
  if(tp){ content=tp.exos.map(x=>{const e=exo(x.exId); if(!e)return'';
    return `<div class="exo-l">${exoArt(e,sp?.color||'var(--acc)',46)}
      <div class="grow"><div class="nm">${esc(e.name)}</div><div class="zz">${ZONES[e.zone]||''}</div></div>
      <div class="sr">${x.sets} × ${esc(x.reps)}</div></div>`;}).join('');
  } else content=`<div class="it-sub" style="padding:6px 0">${esc(sp?.name||'')}${type==='rule'?' · séance récurrente':''}</div>`;

  let logHTML='';
  if(log){ logHTML=`<div class="card" style="margin-top:14px"><div class="card-t">✓ Séance faite</div>${logSummary(log)}
    <button class="btn dgr" onclick="deleteLog('${log.id}')">Supprimer ce log</button></div>`; }

  openSheet(`<div class="row"><span class="dot" style="background:${sp?.color}"></span>
    <div class="sh-t" style="margin:0">${esc(o.label)}</div></div>
    <div class="it-sub" style="margin:4px 0 14px;text-transform:capitalize">${fmtLong(date)}${o.time?' · '+o.time:''}</div>
    ${content}${logHTML}
    ${tp?`<button class="btn sec" onclick="restPicker()">⏱ Minuteur de repos</button>`:''}
    ${!log?`<button class="btn" onclick="openLogForm('${type}','${id}','${date}')">✅ Séance faite — enregistrer</button>`:''}
    ${type==='one'?`<button class="btn dgr" onclick="deleteOneoff('${id}')">Supprimer cette séance</button>`
                  :`<button class="btn dgr" onclick="skipRule('${id}','${date}')">Annuler cette occurrence</button>`}`);
}
function deleteOneoff(id){ if(!confirm('Supprimer cette séance ?'))return; state.oneoffs=state.oneoffs.filter(o=>o.id!==id); save(); closeSheet(); render(); }
function skipRule(id,date){ if(!confirm('Annuler la séance de ce jour uniquement ?'))return; state.skips.push({ruleId:id,date}); save(); closeSheet(); render(); }
function deleteLog(id){ if(!confirm('Supprimer ce log ?'))return; state.logs=state.logs.filter(l=>l.id!==id); save(); closeSheet(); render(); }

const FEELS=['😫','😕','🙂','💪','🔥'];
function logSummary(log){
  let h='';
  if(log.kind==='muscu'){
    h=log.data.map(d=>{const e=exo(d.exId);return `<div class="rec-row"><span style="font-weight:600">${esc(e?.name||'?')}</span>
      <span class="t">${esc(d.weight||'—')} · ${esc(d.reps||'—')}</span></div>`;}).join('');
  } else {
    const bike=/v[ée]lo|bike|cycl/i.test(sport(log.sportId)?.name||'');
    const p=log.dist&&log.timeSec?(bike?`${(log.dist/(log.timeSec/3600)).toFixed(1).replace('.',',')} km/h`:fmtPace(log.timeSec/log.dist)):'—';
    h=`<div class="rec-row"><span class="d">Distance</span><span class="t">${String(log.dist??'—').replace('.',',')} km</span></div>
       <div class="rec-row"><span class="d">Temps</span><span class="t">${fmtHMS(log.timeSec)}</span></div>
       <div class="rec-row"><span class="d">${bike?'Vitesse':'Allure'}</span><span class="t">${p}</span></div>`;
  }
  if(log.feel!=null)h+=`<div style="margin-top:8px;font-size:20px">${FEELS[log.feel]}${log.note?` <span class="it-sub">${esc(log.note)}</span>`:''}</div>`;
  else if(log.note)h+=`<div class="it-sub" style="margin-top:8px">${esc(log.note)}</div>`;
  return h;
}

/* ============ LOG D'UNE SÉANCE ============ */
let logCtx=null;
function openLogForm(type,id,date){
  const src=type==='rule'?state.recurring.find(r=>r.id===id):state.oneoffs.find(o=>o.id===id);
  const o=occ(type,src,date),sp=sport(o.sportId),tp=tplById(o.templateId);
  const isMuscu=!!tp;
  const isCardio=/running|vélo|velo/i.test(sp?.name||'');
  logCtx={type,id,date,sportId:o.sportId,kind:isMuscu?'muscu':'cardio',tp,feel:null};
  let body='';
  if(isMuscu){
    body=tp.exos.map((x,i)=>{const e=exo(x.exId);return `
      <div class="exo-l">${exoArt(e,sp?.color||'var(--acc)',42)}
        <div class="grow"><div class="nm">${esc(e?.name||'?')}</div><div class="zz">prévu : ${x.sets} × ${esc(x.reps)}</div>
        <div class="frow" style="margin-top:6px">
          <div><input class="f" id="lw_${i}" placeholder="Poids (ex 60 kg)" onchange="autoRest()"></div>
          <div><input class="f" id="lr_${i}" placeholder="Reps (ex 4×8)" onchange="autoRest()"></div>
        </div></div></div>`;}).join('');
    body=`<div class="hrow"><button onclick="restStart(state.settings.restDefault)">⏱ Lancer ${state.settings.restDefault}s</button><button onclick="restPicker()">Réglages</button></div>`+body;
  } else {
    const prev=lastCardioLog(o.sportId);
    body=`${prev?`<div class="loghead">Dernière sortie : <b>${prev.dist} km</b> en <b>${fmtHMS(prev.timeSec)}</b> (${fmtPace(prev.timeSec/prev.dist)})</div>`:''}
      ${isCardio?`<button class="btn sec" onclick="startOCR()">📷 Lire un screenshot Strava</button><div id="ocrStatus"></div>`:''}
      <div class="frow" style="margin-top:12px">
        <div><label class="f">Distance (km)</label><input class="f" id="l_dist" type="text" inputmode="decimal" placeholder="10,2"></div>
        <div><label class="f">Temps</label><input class="f" id="l_time" placeholder="52:30"></div>
      </div><div class="hint" id="paceHint"></div>`;
  }
  openSheet(`<div class="sh-t">Log — ${esc(o.label)}</div>
    <div class="it-sub" style="margin:-6px 0 12px;text-transform:capitalize">${fmtLong(date)}</div>
    ${body}
    <label class="f">Ressenti</label>
    <div class="feel">${FEELS.map((f,i)=>`<button id="feel_${i}" onclick="setFeel(${i})">${f}</button>`).join('')}</div>
    <label class="f">Note</label><textarea class="f" id="l_note" placeholder="Optionnel"></textarea>
    <button class="btn" onclick="saveLog()">Enregistrer la séance</button>`);
  const dEl=$('#l_dist'),tEl=$('#l_time');
  if(dEl){ const upd=()=>{ const d=parseFloat(dEl.value.replace(',','.')),t=parseHMS(tEl.value);
    $('#paceHint').textContent=(d&&t)?`Allure : ${fmtPace(t/d)}`:''; };
    dEl.addEventListener('input',upd); tEl.addEventListener('input',upd); }
}
function autoRest(){ if(state.settings.restAuto&&!rest.t)restStart(state.settings.restDefault); }
function setFeel(i){ logCtx.feel=i; FEELS.forEach((_,k)=>$('#feel_'+k).classList.toggle('on',k===i)); }
function lastCardioLog(sportId){
  return state.logs.filter(l=>l.sportId===sportId&&l.kind==='cardio'&&l.dist&&l.timeSec)
    .sort((a,b)=>b.date.localeCompare(a.date))[0]||null;
}
function saveLog(){
  const c=logCtx; if(!c)return;
  const log={id:uid(),refType:c.type,refId:c.id,date:c.date,sportId:c.sportId,kind:c.kind,feel:c.feel,note:$('#l_note').value.trim()};
  if(c.kind==='muscu'){
    log.data=c.tp.exos.map((x,i)=>({exId:x.exId,weight:$('#lw_'+i).value.trim(),reps:$('#lr_'+i).value.trim()}));
  } else {
    log.dist=parseFloat(($('#l_dist').value||'').replace(',','.'))||null;
    log.timeSec=parseHMS($('#l_time').value)||null;
    if(sport(c.sportId)&&/running/i.test(sport(c.sportId).name))log._rec=updateRecords(log);
  }
  state.logs.push(log); save(); closeSheet(); render();
  toast(log._rec?`🏆 Nouveau record ${log._rec} !`:'Séance enregistrée 💪'); delete log._rec;
}
function updateRecords(log){
  if(!log.dist||!log.timeSec)return null; let hit=null;
  state.records.forEach(r=>{
    if(!r.dist)return;
    if(log.dist>=r.dist*0.98&&log.dist<=r.dist*1.06&&(r.time==null||log.timeSec<r.time)){
      r.time=log.timeSec; r.date=log.date; hit=r.label;
    }
  });
  return hit;
}

/* ============ OCR STRAVA ============ */
function startOCR(){ $('#ocrFile').value=''; $('#ocrFile').click(); }
$('#ocrFile')?.addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f)return;
  const st=$('#ocrStatus'); if(st)st.innerHTML='<div class="ocr-load"><span class="spin"></span>Lecture du screenshot…</div>';
  try{
    if(!window.Tesseract){
      await new Promise((res,rej)=>{const s=document.createElement('script');
        s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
        s.onload=res;s.onerror=()=>rej(new Error('cdn'));document.head.appendChild(s);});
    }
    const r=await Tesseract.recognize(f,'eng');
    let txt=(r.data.text||'').replace(/\u00a0/g,' ');
    // 1) retirer la barre d'état (heure + batterie) : on ignore la 1re ligne courte
    const lines=txt.split('\n');
    if(lines.length>1&&/^\s*\d{1,2}[:.]\d{2}\b/.test(lines[0])&&lines[0].length<40)lines.shift();
    txt=lines.join('\n');
    // 2) neutraliser les heures de publication ("Aujourd'hui à 10:41", "hier a 9.05")
    txt=txt.replace(/(aujourd\S*hui|hier|today|yesterday|le\s+\d{1,2}\s+\w+)?\s*[àa]\s*\d{1,2}[:.]\d{2}/gi,' ');
    let dist=null,time=null,pace=null;
    // 3) distance
    const dm=txt.match(/(\d+[.,]\d+)\s*k[m]?\b/i)||txt.match(/\b(\d{1,3})[.,]?(\d*)\s*K\b/);
    if(dm)dist=parseFloat((dm[1]+(dm[2]?'.'+dm[2]:'')).replace(',','.'));
    // 4) allure (5:46 /km)
    const pm=txt.match(/(\d{1,2})[:.](\d{2})\s*\/?\s*km/i);
    if(pm)pace=(+pm[1])*60+(+pm[2]);
    // 5) durée format Strava : 38min 57s / 1h 05min 12s / 45 min
    const sm=txt.match(/(?:(\d{1,2})\s*h[a-z]*\s*)?(\d{1,3})\s*m(?:in|n)?[a-z]*\s*(?:(\d{1,2})\s*s)?/i);
    if(sm&&(sm[1]||sm[3]||+sm[2]>=5))time=(+(sm[1]||0))*3600+(+sm[2])*60+(+(sm[3]||0));
    // 6) sinon, format à deux-points hors allure
    if(time==null){
      const hms=txt.match(/\b(\d{1,2}):([0-5]\d):([0-5]\d)\b/);
      if(hms)time=(+hms[1])*3600+(+hms[2])*60+(+hms[3]);
      else{
        for(const m of txt.matchAll(/\b(\d{1,3}):([0-5]\d)\b/g)){
          if(/\s*\/?\s*km/i.test(txt.slice(m.index+m[0].length,m.index+m[0].length+6)))continue;
          time=(+m[1])*60+(+m[2]); break;
        }
      }
    }
    // 7) recoupement allure × distance
    if(time==null&&pace&&dist)time=Math.round(pace*dist);
    let warn='';
    if(dist&&time){
      const p=time/dist;
      if(pace&&Math.abs(p-pace)>60){ time=Math.round(pace*dist); }
      else if(p<120||p>900){ warn='⚠️ Allure incohérente détectée — vérifie le temps.'; }
    }
    if(dist&&$('#l_dist'))$('#l_dist').value=String(dist).replace('.',',');
    if(time&&$('#l_time'))$('#l_time').value=fmtHMS(time);
    if(st)st.innerHTML=`<div class="hint">${warn||((dist||time)?'✅ Valeurs détectées — vérifie et corrige si besoin.':'⚠️ Rien détecté, saisis les valeurs à la main.')}</div>`;
    $('#l_dist')?.dispatchEvent(new Event('input'));
  }catch(err){
    if(st)st.innerHTML='<div class="hint">⚠️ Lecture impossible (connexion requise la première fois). Saisis à la main.</div>';
  }
});

/* ============ ONGLET STATS ============ */
/* --- Analyse des logs muscu --- */
function plannedSets(log,exId){
  const src=log.refType==='rule'?state.recurring.find(r=>r.id===log.refId):state.oneoffs.find(o=>o.id===log.refId);
  const tp=src&&tplById(src.templateId);
  const x=tp&&tp.exos.find(e=>e.exId===exId);
  if(x)return x.sets;
  return exo(exId)?.sets||3;
}
function parseWeight(s,dateISO){
  if(!s)return null;
  const t=String(s).toLowerCase().replace(',','.');
  if(/pdc|poids du corps|corps|bodyweight/.test(t)){
    const ws=state.body?.weights?.slice().sort((a,b)=>a.date.localeCompare(b.date))||[];
    const w=ws.filter(x=>x.date<=dateISO).pop()||ws[0];
    return w?w.kg:null;
  }
  const m=t.match(/(\d+(?:\.\d+)?)/);
  if(!m)return null;
  let v=parseFloat(m[1]);
  if(/lb|lbs/.test(t))v*=0.4536;
  return v;
}
function parseReps(s,ps){
  if(!s)return null;
  const raw=String(s).toLowerCase().trim();
  const t=raw.replace(/\s/g,'');
  let m=t.match(/^(\d+)[x×*](\d+)$/);            // 4x8
  if(m)return {sets:+m[1],reps:+m[2],total:+m[1]*+m[2]};
  m=t.match(/^(\d+)[x×*](\d+)[x×*](\d+)$/);      // 4x8x2
  if(m)return {sets:+m[1],reps:+m[2],total:+m[1]*+m[2]*+m[3]};
  if(/[,;/+\s]/.test(raw)){                       // 8,8,7  ou  8 8 7
    const p=raw.split(/[,;/+\s]+/).map(Number).filter(x=>x>0&&x<200);
    if(p.length>1){ const tot=p.reduce((a,b)=>a+b,0);
      return {sets:p.length,reps:Math.round(tot/p.length),total:tot}; }
    if(p.length===1)return {sets:ps,reps:p[0],total:ps*p[0]};
  }
  const v=parseFloat(t);
  if(v>0)return {sets:ps,reps:v,total:ps*v};      // "8" -> séries prévues x 8
  return null;
}
function logVolume(l){
  if(l.kind!=='muscu')return 0;
  let v=0;
  l.data.forEach(d=>{
    const w=parseWeight(d.weight,l.date), r=parseReps(d.reps,plannedSets(l,d.exId));
    if(w&&r)v+=w*r.total;
  });
  return v;
}
const kfmt=v=>v>=1000?(v/1000).toFixed(v>=10000?0:1).replace('.',',')+' t':Math.round(v)+' kg';
function logsIn(days){
  const from=iso(addD(new Date(),-days+1));
  return state.logs.filter(l=>l.date>=from);
}
function tplCatOf(l){
  const src=l.refType==='rule'?state.recurring.find(r=>r.id===l.refId):state.oneoffs.find(o=>o.id===l.refId);
  const tp=src&&tplById(src.templateId);
  if(!tp)return null;
  const n=tp.name.toLowerCase();
  if(/push/.test(n))return 'push'; if(/pull/.test(n))return 'pull';
  if(/leg|jambe/.test(n))return 'legs';
  const cnt={push:0,pull:0,legs:0};
  tp.exos.forEach(x=>{ const e=exo(x.exId); if(e&&cnt[e.cat]!=null)cnt[e.cat]++; });
  const best=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  return cnt[best]?best:null;
}
/* --- Graphiques --- */
function barChart(vals,labels,color='#FF5A1F',h=76){
  const mx=Math.max(...vals,1), w=100, n=vals.length, bw=w/n*0.62, gap=w/n;
  let bars='';
  vals.forEach((v,i)=>{ const bh=v/mx*(h-14);
    bars+=`<rect x="${(i*gap+(gap-bw)/2).toFixed(2)}" y="${(h-bh).toFixed(2)}" width="${bw.toFixed(2)}" height="${Math.max(bh,1.5).toFixed(2)}" rx="1.2" fill="${color}" opacity="${i===n-1?1:.62}"/>`;});
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" height="${h}">${bars}</svg>
    <div class="xlab">${labels.map(l=>`<span>${l}</span>`).join('')}</div>`;
}
function lineChart(pts,h=88,color='#FF5A1F'){
  if(pts.length<2)return '';
  const vs=pts.map(p=>p.v), mn=Math.min(...vs), mx=Math.max(...vs), sp=(mx-mn)||1;
  const w=100, X=i=>i/(pts.length-1)*w, Y=v=>h-8-((v-mn)/sp)*(h-20);
  const line=pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const dots=pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="1.7" fill="${color}"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" height="${h}">
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${dots}</svg>
    <div class="xlab"><span>${fmtShort(pts[0].d)}</span><span>${fmtShort(pts[pts.length-1].d)}</span></div>`;
}

function statsMuscu(){
  const logs=logsIn(statPeriod).filter(l=>l.kind==='muscu');
  if(!logs.length)return `<div class="card"><div class="card-t">Aucune donnée</div>
    <div class="empty-s">Enregistre des séances de musculation avec les poids et les répétitions pour voir apparaître ton volume, ta répartition Push/Pull/Legs et ta progression par exercice.</div></div>`;

  /* Volume par semaine */
  const nW=statPeriod<=28?6:statPeriod<=91?12:16;
  const mon=monday(new Date()), weeks=[], wl=[];
  for(let i=nW-1;i>=0;i--){
    const s=addD(mon,-7*i), e=addD(s,7);
    const v=state.logs.filter(l=>l.kind==='muscu'&&l.date>=iso(s)&&l.date<iso(e))
      .reduce((a,l)=>a+logVolume(l),0);
    weeks.push(v); wl.push(i%(nW>8?3:1)===0||i===0?`${s.getDate()}/${s.getMonth()+1}`:'');
  }
  const tot=logs.reduce((a,l)=>a+logVolume(l),0);
  const cur=weeks[weeks.length-1], prev=weeks[weeks.length-2]||0;
  const dv=prev?Math.round((cur-prev)/prev*100):null;
  const volume=`<div class="card"><div class="card-t">🏋️ Volume soulevé</div>
    <div class="bigv">${kfmt(tot)}</div>
    <div class="it-sub">sur ${statPeriod>=3650?'toute la période':statPeriod+' jours'} · ${logs.length} séance${logs.length>1?'s':''}</div>
    ${dv!==null?`<div class="delta" style="color:${dv>=0?'var(--ok)':'var(--warn)'};margin-top:4px">${dv>=0?'+':''}${dv} % cette semaine vs la précédente</div>`:''}
    ${barChart(weeks,wl)}
    <div class="hint">Volume = poids × répétitions totales, cumulé sur tous les exercices.</div></div>`;

  /* Répartition PPL */
  const cnt={push:0,pull:0,legs:0,autre:0};
  logs.forEach(l=>{ const k=tplCatOf(l); cnt[k||'autre']++; });
  const T=logs.length;
  const COL={push:'#FF5A1F',pull:'#E0863C',legs:'#0FA3E0',autre:'#8E8F96'};
  const parts=Object.keys(cnt).filter(k=>cnt[k]);
  const mxc=Math.max(cnt.push,cnt.pull,cnt.legs), mnc=Math.min(cnt.push,cnt.pull,cnt.legs);
  const ppl=`<div class="card"><div class="card-t">⚖️ Répartition Push / Pull / Legs</div>
    <div class="stack">${parts.map(k=>`<i style="flex:${cnt[k]};background:${COL[k]}"></i>`).join('')}</div>
    <div class="lg">${parts.map(k=>`<span><i style="background:${COL[k]}"></i>${CATS[k]||'Autre'} ${cnt[k]}</span>`).join('')}</div>
    ${T>=3?`<div class="hint">${mxc-mnc>=2?`⚠️ Écart de ${mxc-mnc} séances entre le groupe le plus et le moins travaillé.`:'✅ Répartition équilibrée.'}</div>`:''}</div>`;

  /* Séries par groupe musculaire */
  const zs={};
  logs.forEach(l=>l.data.forEach(d=>{ const e=exo(d.exId); if(!e)return;
    const r=parseReps(d.reps,plannedSets(l,d.exId)); if(!r)return;
    zs[e.zone]=(zs[e.zone]||0)+r.sets; }));
  const zk=Object.keys(zs).sort((a,b)=>zs[b]-zs[a]), zmx=Math.max(...Object.values(zs),1);
  const zones=zk.length?`<div class="card"><div class="card-t">🫀 Séries par groupe musculaire</div>
    ${zk.map(k=>`<div class="zrow"><span class="zn">${ZONES[k]||k}</span>
      <span class="zb"><i style="width:${zs[k]/zmx*100}%"></i></span>
      <span class="zv">${zs[k]} séries</span></div>`).join('')}
    <div class="hint">Environ 10 à 20 séries par groupe et par semaine sont recommandées pour progresser.</div></div>`:'';

  /* Progression par exercice */
  const done={};
  logs.forEach(l=>l.data.forEach(d=>{ if(parseWeight(d.weight,l.date))done[d.exId]=(done[d.exId]||0)+1; }));
  const exIds=Object.keys(done).sort((a,b)=>done[b]-done[a]);
  if(exIds.length&&!statExo)statExo=exIds[0];
  let prog='';
  if(exIds.length){
    const pts=[];
    state.logs.filter(l=>l.kind==='muscu').sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{
      const d=l.data.find(x=>x.exId===statExo); if(!d)return;
      const w=parseWeight(d.weight,l.date); if(w)pts.push({d:l.date,v:w});
    });
    const pr=pts.length?Math.max(...pts.map(p=>p.v)):0;
    const first=pts[0], last=pts[pts.length-1];
    prog=`<div class="card"><div class="card-t">📈 Progression des charges</div>
      <select class="f" onchange="statExo=this.value;render()" style="margin-bottom:4px">
        ${exIds.map(id=>`<option value="${id}" ${id===statExo?'selected':''}>${esc(exo(id)?.name||'?')}</option>`).join('')}
      </select>
      ${pts.length>1?`<div class="bigv" style="margin-top:10px">${String(last.v).replace('.',',')} <small>kg</small></div>
        <div class="delta" style="color:${last.v>=first.v?'var(--ok)':'var(--warn)'}">${last.v>=first.v?'+':''}${(last.v-first.v).toFixed(1)} kg depuis le ${fmtShort(first.d)}</div>
        ${lineChart(pts)}
        <div class="hint">Record : ${String(pr).replace('.',',')} kg · ${pts.length} séances enregistrées</div>`
       :`<div class="empty-s">Une seule séance enregistrée pour cet exercice — la courbe apparaîtra dès la deuxième.</div>`}</div>`;
  }

  /* Top exercices */
  const evol={};
  logs.forEach(l=>l.data.forEach(d=>{ const w=parseWeight(d.weight,l.date), r=parseReps(d.reps,plannedSets(l,d.exId));
    if(w&&r)evol[d.exId]=(evol[d.exId]||0)+w*r.total; }));
  const top=Object.keys(evol).sort((a,b)=>evol[b]-evol[a]).slice(0,5);
  const tmx=evol[top[0]]||1;
  const topc=top.length?`<div class="card"><div class="card-t">🔝 Exercices les plus chargés</div>
    ${top.map(id=>`<div class="zrow"><span class="zn" style="width:112px">${esc(exo(id)?.name||'?')}</span>
      <span class="zb"><i style="width:${evol[id]/tmx*100}%"></i></span>
      <span class="zv">${kfmt(evol[id])}</span></div>`).join('')}</div>`:'';

  return volume+ppl+zones+prog+topc;
}

function addSleep(){

  openSheet(`<div class="sh-t">😴 Nuit</div>

function sleepHours(b,w){
  if(!b||!w)return 0;
  const [bh,bm]=b.split(':').map(Number), [wh,wm]=w.split(':').map(Number);
  let h=(wh*60+wm)-(bh*60+bm); if(h<=0)h+=1440;
  return Math.round(h/60*100)/100;
}
function saveSleep(){
  const d=$('#sl_date').value, b=$('#sl_b').value, w=$('#sl_w').value;

  state.body.sleep=state.body.sleep.filter(x=>x.date!==d);

}

  const runs=all.filter(l=>isRun(l.sportId)), bikes=all.filter(l=>isBike(l.sportId));
  const sel=cardioSport==='bike'?bikes:cardioSport==='run'?runs:all;
  const filt=`<div class="seg" style="margin-bottom:14px">
    ${[['','Tout'],['run','Course'],['bike','Vélo']].map(([k,l])=>
      `<button class="${(cardioSport||'')===k?'on':''}" onclick="cardioSport=${k?`'${k}'`:'null'};render()">${l}</button>`).join('')}</div>`;

  /* Volume par semaine */
  const nW=statPeriod<=28?6:statPeriod<=91?12:16;
  const mon=monday(new Date()), weeks=[], wl=[];
  for(let i=nW-1;i>=0;i--){
    const s=addD(mon,-7*i), e=addD(s,7);
    const km=state.logs.filter(l=>l.kind==='cardio'&&l.dist&&l.date>=iso(s)&&l.date<iso(e)
      &&(cardioSport==='bike'?isBike(l.sportId):cardioSport==='run'?isRun(l.sportId):true))
      .reduce((a,l)=>a+l.dist,0);
    weeks.push(km); wl.push(i%(nW>8?3:1)===0||i===0?`${s.getDate()}/${s.getMonth()+1}`:'');
  }
  const totKm=sel.reduce((a,l)=>a+l.dist,0);
  const totT=sel.reduce((a,l)=>a+l.timeSec,0);
  const cur=weeks[weeks.length-1], prev=weeks[weeks.length-2]||0;
  const dk=prev?Math.round((cur-prev)/prev*100):null;
  /* mois en cours vs précédent */
  const now=new Date(), m0=`${now.getFullYear()}-${D2(now.getMonth()+1)}`;
  const pm=new Date(now.getFullYear(),now.getMonth()-1,1), m1=`${pm.getFullYear()}-${D2(pm.getMonth()+1)}`;
  const kmOf=(mk,maxDay)=>state.logs.filter(l=>l.kind==='cardio'&&l.dist&&l.date.startsWith(mk)
    &&(!maxDay||+l.date.slice(8,10)<=maxDay)
    &&(cardioSport==='bike'?isBike(l.sportId):cardioSport==='run'?isRun(l.sportId):true)).reduce((a,l)=>a+l.dist,0);
  const dnow=now.getDate();
  const kmNow=kmOf(m0), kmPrevSame=kmOf(m1,dnow), kmPrevFull=kmOf(m1);
  const dm=kmNow-kmPrevSame;
  const volume=`<div class="card"><div class="card-t">📍 Volume — ${MONTHS[now.getMonth()]}</div>
    <div class="bigv">${kmNow.toFixed(1).replace('.',',')} <small>km</small></div>
    ${kmPrevSame?`<div class="delta" style="color:${dm>=0?'var(--ok)':'var(--warn)'}">${dm>=0?'+':''}${dm.toFixed(1).replace('.',',')} km vs ${MONTHS[pm.getMonth()]} au même stade</div>
       <div class="it-sub" style="font-size:12px">${MONTHS[pm.getMonth()]} au total : ${kmPrevFull.toFixed(1).replace('.',',')} km</div>`
            :`<div class="it-sub">Pas de comparaison disponible</div>`}
    ${barChart(weeks,wl,'#0FA3E0')}
    <div class="hint">Sur ${statPeriod>=3650?'toute la période':statPeriod+' jours'} : ${totKm.toFixed(1).replace('.',',')} km · ${sel.length} sortie${sel.length>1?'s':''} · ${fmtHMS(totT)} cumulées${dk!==null?` · ${dk>=0?'+':''}${dk} % cette semaine`:''}</div></div>`;

  /* Objectif chrono */
  let obj='';
  if(runs.length||state.logs.some(l=>l.kind==='cardio'&&isRun(l.sportId))){
    const g=state.goals, tol=[g.runDist*0.97,g.runDist*1.06];
    const cands=state.logs.filter(l=>l.kind==='cardio'&&isRun(l.sportId)&&l.dist>=tol[0]&&l.dist<=tol[1]&&l.timeSec)
      .sort((a,b)=>a.timeSec-b.timeSec);
    const best=cands[0];
    if(best){
      const pct=Math.max(0,Math.min(100,g.runTime/best.timeSec*100));
      const gap=best.timeSec-g.runTime;
      obj=`<div class="card" onclick="editGoal()" style="cursor:pointer"><div class="card-t">🎯 Objectif ${g.runDist} km</div>
        <div class="bigv">${fmtHMS(best.timeSec)} <small>→ ${fmtHMS(g.runTime)}</small></div>
        <div class="delta" style="color:${gap<=0?'var(--ok)':'var(--acc)'}">${gap<=0?'🏆 Objectif atteint !':`Il reste ${fmtHMS(gap)} à gagner`}</div>
        <div class="gauge"><i style="width:${pct}%"></i></div>
        <div class="hint">Meilleur temps le ${fmtLong(best.date)} · allure ${fmtPace(best.timeSec/best.dist)} · allure cible ${fmtPace(g.runTime/g.runDist)}</div></div>`;
    } else {
      obj=`<div class="card" onclick="editGoal()" style="cursor:pointer"><div class="card-t">🎯 Objectif ${g.runDist} km</div>
        <div class="bigv">${fmtHMS(g.runTime)}</div>
        <div class="hint">Aucune sortie proche de ${g.runDist} km enregistrée. Allure à tenir : ${fmtPace(g.runTime/g.runDist)}. Touche la carte pour modifier l\u2019objectif.</div></div>`;
    }
  }

  /* Allure */
  let pace='';
  if(runs.length>1&&cardioSport!=='bike'){
    const pts=runs.map(l=>({d:l.date,v:Math.round(l.timeSec/l.dist)}));
    const avg=pts.reduce((a,p)=>a+p.v,0)/pts.length;
    const half=Math.ceil(pts.length/2);
    const a1=pts.slice(0,half).reduce((a,p)=>a+p.v,0)/half;
    const a2=pts.slice(half).reduce((a,p)=>a+p.v,0)/(pts.length-half);
    const d=a2-a1;
    pace=`<div class="card"><div class="card-t">⏱ Allure en course</div>
      <div class="bigv">${fmtPace(avg)}</div>
      <div class="delta" style="color:${d<=0?'var(--ok)':'var(--warn)'}">${d<=0?'▼':'▲'} ${fmtHMS(Math.abs(Math.round(d)))} par km sur la 2ᵉ moitié de la période</div>
      ${lineChart(pts,88,'#0FA3E0')}
      <div class="hint">Plus la courbe descend, plus tu vas vite. Les sorties longues remontent naturellement la moyenne.</div></div>`;
  }

  /* Meilleures performances par palier */
  const PAL=[[1,'1 km'],[5,'5 km'],[10,'10 km'],[21.1,'Semi'],[42.2,'Marathon']];
  const perf=PAL.map(([d,l])=>{
    const cs=state.logs.filter(x=>x.kind==='cardio'&&isRun(x.sportId)&&x.dist>=d*0.97&&x.dist<=d*1.06&&x.timeSec)
      .sort((a,b)=>a.timeSec-b.timeSec);
    return cs[0]?`<div class="rec-row"><span class="d">${l}</span>
      <span class="dt">${fmtPace(cs[0].timeSec/cs[0].dist)}</span>
      <span class="t">${fmtHMS(cs[0].timeSec)}</span></div>`:'';
  }).join('');
  const records=perf?`<div class="card"><div class="card-t">🏆 Meilleurs temps</div>${perf}</div>`:'';

  /* Répartition et moyennes */
  const stat=(arr)=>arr.length?{n:arr.length,km:arr.reduce((a,l)=>a+l.dist,0),
    avg:arr.reduce((a,l)=>a+l.dist,0)/arr.length}:null;
  const sr=stat(runs), sb=stat(bikes);
  const rep2=(sr||sb)?`<div class="card"><div class="card-t">📊 Répartition</div>
    ${sr?`<div class="zrow"><span class="zn">🏃 Course</span>
      <span class="zb"><i style="width:${sr.km/(sr.km+(sb?sb.km:0))*100}%"></i></span>
      <span class="zv" style="width:70px">${sr.km.toFixed(0)} km</span></div>
      <div class="it-sub" style="margin:-2px 0 8px 97px">${sr.n} sortie${sr.n>1?'s':''} · ${sr.avg.toFixed(1).replace('.',',')} km en moyenne</div>`:''}
    ${sb?`<div class="zrow"><span class="zn">🚴 Vélo</span>
      <span class="zb"><i style="width:${sb.km/(sb.km+(sr?sr.km:0))*100}%;background:#0FA3E0"></i></span>
      <span class="zv" style="width:70px">${sb.km.toFixed(0)} km</span></div>
      <div class="it-sub" style="margin:-2px 0 4px 97px">${sb.n} sortie${sb.n>1?'s':''} · ${sb.avg.toFixed(1).replace('.',',')} km en moyenne · ${(sb.km/(bikes.reduce((a,l)=>a+l.timeSec,0)/3600)).toFixed(1).replace('.',',')} km/h</div>`:''}
  </div>`:'';

  /* Dernières sorties */
  const last=sel.slice().reverse().slice(0,5).map(l=>{
    const sp=sport(l.sportId);
    const speed=isBike(l.sportId)?`${(l.dist/(l.timeSec/3600)).toFixed(1).replace('.',',')} km/h`:fmtPace(l.timeSec/l.dist);
    return `<div class="item" onclick="openLogDetail('${l.id}')">
      <span class="dot" style="background:${sp?.color}"></span>
      <div class="grow"><div class="it-name">${String(l.dist).replace('.',',')} km · ${fmtHMS(l.timeSec)}</div>
      <div class="it-sub">${fmtLong(l.date)} · ${speed}</div></div>
      ${l.feel!=null?`<span style="font-size:16px">${FEELS[l.feel]}</span>`:''}<span class="chev">›</span></div>`;
  }).join('');
  const recent=last?`<div class="card" style="padding:6px 16px">
    <div class="card-t" style="margin:12px 0 4px">Dernières sorties</div>${last}</div>`:'';

  return filt+volume+obj+pace+records+rep2+recent;
}

  openSheet(`<div class="sh-t">🎯 Objectif course</div>
    <div class="frow"><div><label class="f">Distance (km)</label>

const MEAS=[['poids_bras','Bras'],['poitrine','Poitrine'],['taille','Taille'],['hanches','Hanches'],['cuisse','Cuisse'],['mollet','Mollet']];
const lastW=()=>state.body.weights.slice().sort((a,b)=>b.date.localeCompare(a.date))[0]||null;
function nutriToday(){ const d=todayISO(); let e=state.body.nutri.find(x=>x.date===d);
  if(!e){ e={date:d,prot:0,kcal:0}; state.body.nutri.push(e); } return e; }
function targets(){
  const p=state.body.profile, w=lastW()?.kg;
  if(!w||!p.height||!p.age)return null;
  const bmr=10*w+6.25*p.height-5*p.age+(p.sex==='h'?5:-161);
  const tdee=bmr*(p.activity||1.55);
  const adj={masse:1.12,maintien:1,seche:.85}[p.goal]||1.12;
  return {bmr:Math.round(bmr),kcal:Math.round(tdee*adj/10)*10,prot:Math.round(w*1.9)};
}
function sparkline(vals,w=100,h=30,color='#FF5A1F'){
  if(vals.length<2)return '';
  const mn=Math.min(...vals),mx=Math.max(...vals),sp=(mx-mn)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-2-((v-mn)/sp)*(h-4)).toFixed(1)}`).join(' ');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;margin-top:8px">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

      :'<div class="it-sub">Aucune mesure enregistrée.</div>'}
    ${last?`<div class="hint">Dernière prise : ${fmtLong(last.date)}</div>`:''}

      <div class="it-sub">moyenne sur 7 jours${a28?` · ${Math.floor(a28)} h ${D2(Math.round((a28%1)*60))} sur 4 semaines`:''}</div>

     :`<div class="it-sub">Enregistre tes nuits pour suivre la moyenne.</div>`}

    ${poids}${sommeil}${nutri}${supps}${objectif}${photos}${mes}`;
  loadPhotoThumbs();
}

function compressImg(file,max=900,q=.72){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image();
      im.onload=()=>{ let{width:w,height:h}=im;
        if(Math.max(w,h)>max){ const r=max/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(im,0,0,w,h);
        res(cv.toDataURL('image/jpeg',q)); };
      im.onerror=rej; im.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

/* ============ MINUTEUR DE REPOS ============ */
let rest={left:0,total:0,t:null};
function restStart(sec){
  rest.total=sec; rest.left=sec; clearInterval(rest.t);
  rest.t=setInterval(()=>{ rest.left--; if(rest.left<=0)restDone(); else restPaint(); },1000);
  restPaint(); vib(15);
}
function restStop(){ clearInterval(rest.t); rest.t=null; rest.left=0; restPaint(); }
function restDone(){ clearInterval(rest.t); rest.t=null; rest.left=0; restPaint();
  vib([120,80,120,80,220]); beep(); toast('⏱ Repos terminé — go !'); }
function restPaint(){
  let el=$('#restChip');
  if(!rest.t&&!rest.left){ if(el)el.remove(); return; }
  if(!el){ el=document.createElement('div'); el.id='restChip'; document.body.appendChild(el); }
  const pct=rest.total?(rest.left/rest.total*100):0;
  el.innerHTML=`<div class="rc-bar" style="width:${pct}%"></div>
    <span class="rc-t">${Math.floor(rest.left/60)}:${D2(rest.left%60)}</span>
    <button onclick="restStart(rest.total)">↺</button><button onclick="restStop()">✕</button>`;
}
function vib(p){ try{ navigator.vibrate&&navigator.vibrate(p); }catch(_){} }
function beep(){ try{
  const A=window.AudioContext||window.webkitAudioContext; if(!A)return;
  const ctx=new A(); const o=ctx.createOscillator(),g=ctx.createGain();
  o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
  g.gain.setValueAtTime(.18,ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.6);
  o.start(); o.stop(ctx.currentTime+.6);
}catch(_){}}
function restPicker(){
  const d=state.settings.restDefault;
  openSheet(`<div class="sh-t">⏱ Minuteur de repos</div>
    <div class="frow" style="flex-wrap:wrap;gap:8px">
      ${[45,60,90,120,180,240].map(s=>`<button class="btn sec" style="flex:0 0 30%;margin-top:0"
        onclick="closeSheet();restStart(${s})">${s<60?s+' s':(s/60)+' min'}</button>`).join('')}
    </div>
    <label class="f">Durée par défaut (secondes)</label>
    <input class="f" id="rs_def" type="number" value="${d}">
    <label class="f">Démarrage automatique après chaque série cochée</label>
    <select class="f" id="rs_auto"><option value="1" ${state.settings.restAuto?'selected':''}>Oui</option>
    <option value="0" ${!state.settings.restAuto?'selected':''}>Non</option></select>

}

}

/* ============ RAPPELS ============ */
async function askNotif(){
  if(!('Notification' in window))return toast('Non supporté par ce navigateur');
  const p=await Notification.requestPermission();
  state.settings.notif=(p==='granted'); save();
  toast(state.settings.notif?'Rappels activés':'Rappels refusés');
  if(state.settings.notif)scheduleNotifs();
  render();
}
let notifTimers=[];
function scheduleNotifs(){
  notifTimers.forEach(clearTimeout); notifTimers=[];
  if(!state.settings.notif||Notification.permission!=='granted')return;
  const lead=(state.settings.notifLead||30)*60000, now=Date.now();
  for(let i=0;i<2;i++){ const s=iso(addD(new Date(),i));
    sessionsForDate(s).forEach(o=>{ if(!o.time||findLog(o))return;
      const [h,m]=o.time.split(':').map(Number);
      const d=fromISO(s); d.setHours(h,m,0,0);
      const at=d.getTime()-lead, delay=at-now;
      if(delay>0&&delay<86400000*2)
        notifTimers.push(setTimeout(()=>{ try{ new Notification('ATLAS',{body:`${o.label} dans ${state.settings.notifLead} min`}); }catch(_){} },delay));
    });
  }
}
function icsExport(){
  const pad=n=>String(n).padStart(2,'0');
  const dtz=(d,t)=>{ const [h,m]=(t||'18:00').split(':').map(Number);
    return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(h)}${pad(m)}00`; };
  const WD=['MO','TU','WE','TH','FR','SA','SU'];
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//ATLAS//FR\r\nCALSCALE:GREGORIAN\r\n';
  const mon=monday(new Date());
  state.recurring.forEach(r=>{
    const d=addD(mon,r.dow); const o=occ('rule',r,iso(d));
    const [h,m]=(r.time||'18:00').split(':').map(Number);
    const end=new Date(d); end.setHours(h,m+60,0,0);
    ics+='BEGIN:VEVENT\r\n'+
      `UID:${r.id}@atlas\r\nSUMMARY:${o.label}\r\n`+
      `DTSTART;TZID=Europe/Paris:${dtz(d,r.time)}\r\n`+
      `DTEND;TZID=Europe/Paris:${dtz(end,`${pad(end.getHours())}:${pad(end.getMinutes())}`)}\r\n`+
      `RRULE:FREQ=WEEKLY;BYDAY=${WD[r.dow]}\r\n`+
      `BEGIN:VALARM\r\nTRIGGER:-PT${state.settings.notifLead||30}M\r\nACTION:DISPLAY\r\nDESCRIPTION:${o.label}\r\nEND:VALARM\r\n`+
      'END:VEVENT\r\n';
  });
  ics+='END:VCALENDAR\r\n';
  if(!state.recurring.length)return toast('Aucune séance récurrente');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));
  a.download='atlas-programme.ics'; a.click();
  toast('Ouvre le fichier pour l\u2019ajouter à ton calendrier');
}

/* ============ DÉMARRAGE ============ */
async function boot(){
  let data=null;
  try{ data=await idbGet('state'); }catch(_){}
  if(!data){
    for(const k of [LS_KEY+'_bak',LS_KEY]){
      try{ const raw=localStorage.getItem(k); if(raw){ data=JSON.parse(raw); break; } }catch(_){}
    }
  }
  state=data||seed();
  migrate();
  await saveNow();
  try{ localStorage.removeItem(LS_KEY+'_bak'); }catch(_){}
  render();
  if(state.settings.notif&&'Notification' in window&&Notification.permission==='granted')scheduleNotifs();
}
