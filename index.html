<meta name="theme-color" content="#040B15">
<title>ATLAS</title>
<style>
:root{
  --bg:#F4F4F1; --card:#FFFFFF; --tx:#191A1C; --sub:#82838A; --line:#E7E7E3;
  --acc:#FF5A1F; --ok:#1D9E75; --warn:#EF9F27; --danger:#E24A3B;
  --sil:#C9C9C4; --chip:#F0F0EC;
  --sh:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101113; --card:#1B1C1F; --tx:#F2F2F0; --sub:#8E8F96; --line:#2A2B2F;
    --sil:#3C3D42; --chip:#26272B;
    --sh:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
#view{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px)}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:6px 2px 2px}
.subh{color:var(--sub);font-size:14px;margin:0 2px 16px;text-transform:capitalize}
.brand{display:flex;align-items:center;gap:11px;margin:4px 2px 2px}
.brand img{width:44px;height:54px;object-fit:contain;flex-shrink:0}
.brand h1{margin:0;letter-spacing:.14em;font-size:26px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.card-t{font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.sec-t{font-size:13px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;margin:22px 4px 8px}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:none}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.it-name{font-weight:600}
.it-sub{font-size:13px;color:var(--sub)}
.chev{color:var(--sub);flex-shrink:0}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--chip);color:var(--sub)}
.badge.done{background:rgba(29,158,117,.15);color:var(--ok)}
button{font-family:inherit;border:none;cursor:pointer}
.btn{width:100%;padding:14px;border-radius:14px;font-size:16px;font-weight:700;background:var(--acc);color:#fff;margin-top:10px}
.btn.sec{background:var(--chip);color:var(--tx)}
.btn.dgr{background:transparent;color:var(--danger);font-weight:600}
.btn.sm{width:auto;padding:8px 14px;font-size:14px;margin-top:0}
/* tabbar */
#tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);z-index:50}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;color:var(--sub);font-size:11px;font-weight:600}
.tab.on{color:var(--acc)}
.tab svg{width:26px;height:26px}
/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:100}
#sheetWrap.hidden{display:none}
#backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 22px);animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sh-t{font-size:20px;font-weight:800;margin:2px 0 14px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--sub);margin:14px 2px 6px}
input.f,select.f,textarea.f{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px;font-family:inherit}
textarea.f{resize:vertical;min-height:70px}
.frow{display:flex;gap:10px}.frow>div{flex:1}
/* calendrier */
.seg{display:flex;background:var(--chip);border-radius:11px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:7px;border-radius:9px;background:none;font-size:14px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.cal-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-nav .ttl{flex:1;font-size:17px;font-weight:700;text-transform:capitalize}
.nav-b{width:34px;height:34px;border-radius:50%;background:var(--chip);color:var(--tx);font-size:17px;font-weight:700}
.today-b{padding:7px 12px;border-radius:99px;background:var(--chip);color:var(--acc);font-size:13px;font-weight:700}
.wday{background:var(--card);border-radius:16px;box-shadow:var(--sh);margin-bottom:10px;padding:10px 14px}
.wday.today{outline:2px solid var(--acc)}
.wday-h{display:flex;align-items:baseline;gap:8px;padding:4px 0}
.wday-h .dn{font-weight:800;text-transform:capitalize}
.wday-h .dd{color:var(--sub);font-size:13px}
.sess{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.sess .t{font-size:13px;color:var(--sub);width:44px;flex-shrink:0}
.sess .n{font-weight:600}
.empty{color:var(--sub);font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mwd{text-align:center;font-size:11px;font-weight:700;color:var(--sub);padding:4px 0}
.mday{aspect-ratio:1;border-radius:12px;background:var(--card);box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-size:14px;font-weight:600}
.mday.out{opacity:.28;box-shadow:none;background:transparent}
.mday.tod{outline:2px solid var(--acc)}
.mdots{display:flex;gap:2px;height:5px}
.mdots i{width:5px;height:5px;border-radius:50%}
.ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ymon{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:12px 8px;text-align:center;cursor:pointer}
.ymon .n{font-weight:700;text-transform:capitalize;font-size:14px}
.ymon .c{font-size:12px;color:var(--sub);margin-top:4px}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 84px);width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;font-size:30px;font-weight:400;box-shadow:0 6px 18px rgba(255,90,31,.4);z-index:40;line-height:0}
/* donut */
.donut-wrap{display:flex;align-items:center;gap:18px}
.donut-pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-pct b{font-size:26px;letter-spacing:-.02em}
.donut-pct span{font-size:11px;color:var(--sub)}
.leg-row{display:flex;align-items:center;gap:8px;font-size:14px;padding:3px 0}
.leg-row b{margin-left:auto;font-variant-numeric:tabular-nums}
/* exo dans séance */
.exo-l{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.exo-l:last-child{border:none}
.exo-l .nm{font-weight:600}
.exo-l .zz{font-size:12px;color:var(--sub)}
.exo-l .sr{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
/* palette */
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:8px 0}
.pal button{aspect-ratio:1;border-radius:50%;border:3px solid transparent}
.pal button.on{border-color:var(--tx)}
.cbtn{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);width:100%;color:var(--tx);font-size:16px}
/* records */
.rec-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rec-row:last-child{border:none}
.rec-row .d{font-weight:700;width:80px}
.rec-row .t{font-variant-numeric:tabular-nums;font-weight:700;margin-left:auto}
.rec-row .dt{font-size:12px;color:var(--sub)}
.feel{display:flex;gap:8px;justify-content:space-between;margin-top:4px}
.feel button{flex:1;font-size:24px;padding:8px 0;border-radius:12px;background:var(--chip);opacity:.45}
.feel button.on{opacity:1;outline:2px solid var(--acc)}
.loghead{display:flex;align-items:center;gap:8px;background:var(--chip);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 100px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:200;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
.ocr-load{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:14px;padding:8px 0}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hint{font-size:13px;color:var(--sub);margin-top:8px;line-height:1.4}
</style>
</head>
<body>
<main id="view"></main>

<div id="sheetWrap" class="hidden">
  <div id="backdrop" onclick="closeSheet()"></div>
  <div id="sheet"></div>
</div>

<nav id="tabbar">
  <button class="tab" id="tab-dash" onclick="go('dash')">

    Tableau de bord</button>
  <button class="tab" id="tab-cal" onclick="go('cal')">

    Calendrier</button>
  <button class="tab" id="tab-exos" onclick="go('exos')">

    Exercices</button>
</nav>

/* ============ SÉANCES / OCCURRENCES ============ */
function occ(type,src,date){ return {type,id:src.id,date,time:src.time||'',sportId:src.sportId,templateId:src.templateId||null,label:src.label||(tplById(src.templateId)?tplById(src.templateId).name:(sport(src.sportId)?.name||'Séance'))}; }
function sessionsForDate(s){
  const d=fromISO(s),wd=dow(d),out=[];
  state.recurring.forEach(r=>{ if(r.dow===wd && !state.skips.find(k=>k.ruleId===r.id&&k.date===s)) out.push(occ('rule',r,s)); });
  state.oneoffs.filter(o=>o.date===s).forEach(o=>out.push(occ('one',o,s)));
  out.sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
  return out;
}
function findLog(o){ return state.logs.find(l=>l.refType===o.type&&l.refId===o.id&&l.date===o.date); }
function weekStats(ref){
  const m=monday(ref||new Date()); let done=0,tot=0; const bySport={};
  for(let i=0;i<7;i++){ const s=iso(addD(m,i));
    sessionsForDate(s).forEach(o=>{ tot++; const sid=o.sportId; bySport[sid]=bySport[sid]||{done:0,tot:0}; bySport[sid].tot++;
      if(findLog(o)){done++;bySport[sid].done++;} });
  }
  return {done,tot,bySport,monday:m};
}
function nextSession(){
  const now=new Date(); const todayS=todayISO(); const nowT=`${D2(now.getHours())}:${D2(now.getMinutes())}`;
  for(let i=0;i<60;i++){ const s=iso(addD(now,i));
    for(const o of sessionsForDate(s)){ if(findLog(o))continue; if(i===0 && o.time && o.time<nowT)continue; return o; } }
  return null;
}

function donutHTML(pct,legend){
  const r=52,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<div class="donut-wrap">
    <div style="position:relative;width:130px;height:130px;flex-shrink:0">
      <svg width="130" height="130" viewBox="0 0 130 130">
        <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--chip)" stroke-width="13"/>
        <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--acc)" stroke-width="13" stroke-linecap="round"
          stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 65 65)"/>
      </svg>
      <div class="donut-pct"><b>${pct}%</b><span>semaine</span></div>
    </div>
    <div class="grow">${legend}</div>
  </div>`;
}
function renderDash(){
  const ws=weekStats(new Date());
  const pct=ws.tot?Math.round(ws.done/ws.tot*100):0;
  let legend=`<div style="font-weight:700;margin-bottom:6px">${ws.done} / ${ws.tot} séance${ws.tot>1?'s':''}</div>`;
  const sids=Object.keys(ws.bySport);
  legend+=sids.length?sids.map(sid=>{const sp=sport(sid),b=ws.bySport[sid];
    return `<div class="leg-row"><span class="dot" style="background:${sp?.color||'#999'}"></span>${esc(sp?.name||'?')}<b>${b.done}/${b.tot}</b></div>`;}).join('')
    :`<div class="it-sub">Aucune séance prévue cette semaine.<br>Ajoute-les dans le calendrier.</div>`;

  const nx=nextSession();
  let nxHTML;
  if(nx){ const sp=sport(nx.sportId); const isToday=nx.date===todayISO();
    nxHTML=`<div class="item" onclick="openSession('${nx.type}','${nx.id}','${nx.date}')">
      <span class="dot" style="background:${sp?.color}"></span>
      <div class="grow"><div class="it-name">${esc(nx.label)}</div>
      <div class="it-sub">${isToday?"Aujourd'hui":fmtLong(nx.date)}${nx.time?' · '+nx.time:''} · ${esc(sp?.name||'')}</div></div>
      <span class="chev">›</span></div>`;
  } else nxHTML=`<div class="it-sub">Rien de planifié. Ajoute une séance depuis le calendrier ➕</div>`;

  const recs=state.records.map(r=>`<div class="rec-row"><span class="d">${esc(r.label)}</span>
    <span class="dt">${r.dist} km${r.date?' · '+fmtLong(r.date):''}</span>
    <span class="t">${fmtHMS(r.time)}</span></div>`).join('');

  $('#view').innerHTML=`
    <div class="brand"><img src="${MARK}" alt=""><h1>${esc(state.name)}</h1></div>
    <div class="subh" style="margin-left:57px">${fmtLong(todayISO())}</div>
    <div class="card"><div class="card-t">Accomplissement de la semaine</div>${donutHTML(pct,legend)}</div>
    <div class="card"><div class="card-t">Prochain entraînement</div>${nxHTML}</div>
    <div class="card" onclick="editRecords()" style="cursor:pointer"><div class="card-t">🏆 Palmarès running</div>${recs}
      <div class="hint">Mis à jour automatiquement après tes sorties. Touche la carte pour modifier.</div></div>`;
}

/* ============ CALENDRIER ============ */
function renderCal(){
  let body='';
  if(calMode==='week')body=weekHTML();
  else if(calMode==='month')body=monthHTML();
  else body=yearHTML();
  $('#view').innerHTML=`
    <h1>Calendrier</h1><div class="subh">&nbsp;</div>
    <div class="seg">
      <button class="${calMode==='week'?'on':''}" onclick="calMode='week';render()">Semaine</button>
      <button class="${calMode==='month'?'on':''}" onclick="calMode='month';render()">Mois</button>
      <button class="${calMode==='year'?'on':''}" onclick="calMode='year';render()">Année</button>
    </div>
    <div class="cal-nav">
      <button class="nav-b" onclick="calShift(-1)">‹</button>
      <div class="ttl">${calTitle()}</div>
      <button class="today-b" onclick="calAnchor=new Date();render()">Aujourd'hui</button>
      <button class="nav-b" onclick="calShift(1)">›</button>
    </div>
    ${body}
    <button class="fab" onclick="addSessionForm('${iso(calAnchor)}')">+</button>`;
}
function calTitle(){
  if(calMode==='week'){ const m=monday(calAnchor),e=addD(m,6);
    return `${m.getDate()} ${m.getMonth()!==e.getMonth()?MSHORT[m.getMonth()]:''} – ${e.getDate()} ${MSHORT[e.getMonth()]} ${e.getFullYear()}`;}
  if(calMode==='month')return `${MONTHS[calAnchor.getMonth()]} ${calAnchor.getFullYear()}`;
  return String(calAnchor.getFullYear());
}
function calShift(n){
  if(calMode==='week')calAnchor=addD(calAnchor,7*n);
  else if(calMode==='month')calAnchor=new Date(calAnchor.getFullYear(),calAnchor.getMonth()+n,1);
  else calAnchor=new Date(calAnchor.getFullYear()+n,calAnchor.getMonth(),1);
  render();
}
function sessLine(o){
  const sp=sport(o.sportId),done=!!findLog(o);
  return `<div class="sess" onclick="openSession('${o.type}','${o.id}','${o.date}')">
    <span class="t">${o.time||'—'}</span><span class="dot" style="background:${sp?.color||'#999'}"></span>
    <span class="n grow">${esc(o.label)}</span>${done?'<span class="badge done">✓ faite</span>':''}</div>`;
}
function weekHTML(){
  const m=monday(calAnchor); let h='';
  for(let i=0;i<7;i++){ const d=addD(m,i),s=iso(d),list=sessionsForDate(s);
    h+=`<div class="wday ${s===todayISO()?'today':''}">
      <div class="wday-h"><span class="dn">${DAYS[i]}</span><span class="dd">${d.getDate()} ${MSHORT[d.getMonth()]}</span>
      <span style="margin-left:auto"><button class="btn sec sm" onclick="addSessionForm('${s}')">＋</button></span></div>
      ${list.length?list.map(sessLine).join(''):'<div class="empty">Repos</div>'}</div>`;
  }
  return h;
}
function monthHTML(){
  const y=calAnchor.getFullYear(),mo=calAnchor.getMonth();
  const first=new Date(y,mo,1),start=monday(first);
  let h='<div class="mgrid">'+DSHORT.map(d=>`<div class="mwd">${d}</div>`).join('');
  for(let i=0;i<42;i++){ const d=addD(start,i); if(i>=35&&d.getMonth()!==mo)break;
    const s=iso(d),list=sessionsForDate(s),out=d.getMonth()!==mo;
    const dots=list.slice(0,3).map(o=>`<i style="background:${sport(o.sportId)?.color||'#999'}"></i>`).join('');
    h+=`<div class="mday ${out?'out':''} ${s===todayISO()?'tod':''}" onclick="openDay('${s}')">${d.getDate()}<span class="mdots">${dots}</span></div>`;
  }
  return h+'</div>';
}
function yearHTML(){
  const y=calAnchor.getFullYear(); let h='<div class="ygrid">';
  for(let mo=0;mo<12;mo++){ let done=0,tot=0;
    const days=new Date(y,mo+1,0).getDate();
    for(let d=1;d<=days;d++){ const list=sessionsForDate(iso(new Date(y,mo,d))); tot+=list.length; list.forEach(o=>{if(findLog(o))done++;}); }
    h+=`<div class="ymon" onclick="calAnchor=new Date(${y},${mo},1);calMode='month';render()">
      <div class="n">${MSHORT[mo]}</div><div class="c">${tot?done+'/'+tot:'—'}</div></div>`;
  }
  return h+'</div>';
}
function openDay(s){
  const list=sessionsForDate(s);
  openSheet(`<div class="sh-t" style="text-transform:capitalize">${fmtLong(s)}</div>
    ${list.length?list.map(sessLine).join(''):'<div class="it-sub">Aucune séance ce jour.</div>'}
    <button class="btn" onclick="addSessionForm('${s}')">＋ Ajouter une séance</button>`);
}

       <div class="rec-row"><span class="d">Temps</span><span class="t">${fmtHMS(log.timeSec)}</span></div>

  }
  openSheet(`<div class="sh-t">Log — ${esc(o.label)}</div>

    <div class="feel">${FEELS.map((f,i)=>`<button id="feel_${i}" onclick="setFeel(${i})">${f}</button>`).join('')}</div>
    <label class="f">Note</label><textarea class="f" id="l_note" placeholder="Optionnel"></textarea>
    <button class="btn" onclick="saveLog()">Enregistrer la séance</button>`);
  const dEl=$('#l_dist'),tEl=$('#l_time');
  if(dEl){ const upd=()=>{ const d=parseFloat(dEl.value.replace(',','.')),t=parseHMS(tEl.value);
    $('#paceHint').textContent=(d&&t)?`Allure : ${fmtPace(t/d)}`:''; };
    dEl.addEventListener('input',upd); tEl.addEventListener('input',upd); }
}
function setFeel(i){ logCtx.feel=i; FEELS.forEach((_,k)=>$('#feel_'+k).classList.toggle('on',k===i)); }
function lastCardioLog(sportId){
  return state.logs.filter(l=>l.sportId===sportId&&l.kind==='cardio'&&l.dist&&l.timeSec)
    .sort((a,b)=>b.date.localeCompare(a.date))[0]||null;
}
function saveLog(){
  const c=logCtx; if(!c)return;
  const log={id:uid(),refType:c.type,refId:c.id,date:c.date,sportId:c.sportId,kind:c.kind,feel:c.feel,note:$('#l_note').value.trim()};
  if(c.kind==='muscu'){
    log.data=c.tp.exos.map((x,i)=>({exId:x.exId,weight:$('#lw_'+i).value.trim(),reps:$('#lr_'+i).value.trim()}));
  } else {
    log.dist=parseFloat(($('#l_dist').value||'').replace(',','.'))||null;
    log.timeSec=parseHMS($('#l_time').value)||null;
    if(sport(c.sportId)&&/running/i.test(sport(c.sportId).name))log._rec=updateRecords(log);
  }
  state.logs.push(log); save(); closeSheet(); render();
  toast(log._rec?`🏆 Nouveau record ${log._rec} !`:'Séance enregistrée 💪'); delete log._rec;
}
function updateRecords(log){
  if(!log.dist||!log.timeSec)return null; let hit=null;
  state.records.forEach(r=>{
    if(!r.dist)return;
    if(log.dist>=r.dist*0.98&&log.dist<=r.dist*1.06&&(r.time==null||log.timeSec<r.time)){
      r.time=log.timeSec; r.date=log.date; hit=r.label;
    }
  });
  return hit;
}

/* ============ OCR STRAVA ============ */
function startOCR(){ $('#ocrFile').value=''; $('#ocrFile').click(); }
$('#ocrFile')?.addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f)return;
  const st=$('#ocrStatus'); if(st)st.innerHTML='<div class="ocr-load"><span class="spin"></span>Lecture du screenshot…</div>';
  try{
    if(!window.Tesseract){
      await new Promise((res,rej)=>{const s=document.createElement('script');
        s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
        s.onload=res;s.onerror=()=>rej(new Error('cdn'));document.head.appendChild(s);});
    }
    const r=await Tesseract.recognize(f,'eng');
    let txt=(r.data.text||'').replace(/\u00a0/g,' ');
    // 1) retirer la barre d'état (heure + batterie) : on ignore la 1re ligne courte
    const lines=txt.split('\n');
    if(lines.length>1&&/^\s*\d{1,2}[:.]\d{2}\b/.test(lines[0])&&lines[0].length<40)lines.shift();
    txt=lines.join('\n');
    // 2) neutraliser les heures de publication ("Aujourd'hui à 10:41", "hier a 9.05")
    txt=txt.replace(/(aujourd\S*hui|hier|today|yesterday|le\s+\d{1,2}\s+\w+)?\s*[àa]\s*\d{1,2}[:.]\d{2}/gi,' ');
    let dist=null,time=null,pace=null;
    // 3) distance
    const dm=txt.match(/(\d+[.,]\d+)\s*k[m]?\b/i)||txt.match(/\b(\d{1,3})[.,]?(\d*)\s*K\b/);
    if(dm)dist=parseFloat((dm[1]+(dm[2]?'.'+dm[2]:'')).replace(',','.'));
    // 4) allure (5:46 /km)
    const pm=txt.match(/(\d{1,2})[:.](\d{2})\s*\/?\s*km/i);
    if(pm)pace=(+pm[1])*60+(+pm[2]);
    // 5) durée format Strava : 38min 57s / 1h 05min 12s / 45 min
    const sm=txt.match(/(?:(\d{1,2})\s*h[a-z]*\s*)?(\d{1,3})\s*m(?:in|n)?[a-z]*\s*(?:(\d{1,2})\s*s)?/i);
    if(sm&&(sm[1]||sm[3]||+sm[2]>=5))time=(+(sm[1]||0))*3600+(+sm[2])*60+(+(sm[3]||0));
    // 6) sinon, format à deux-points hors allure
    if(time==null){
      const hms=txt.match(/\b(\d{1,2}):([0-5]\d):([0-5]\d)\b/);
      if(hms)time=(+hms[1])*3600+(+hms[2])*60+(+hms[3]);
      else{
        for(const m of txt.matchAll(/\b(\d{1,3}):([0-5]\d)\b/g)){
          if(/\s*\/?\s*km/i.test(txt.slice(m.index+m[0].length,m.index+m[0].length+6)))continue;
          time=(+m[1])*60+(+m[2]); break;
        }
      }
    }
    // 7) recoupement allure × distance
    if(time==null&&pace&&dist)time=Math.round(pace*dist);
    let warn='';
    if(dist&&time){
      const p=time/dist;
      if(pace&&Math.abs(p-pace)>60){ time=Math.round(pace*dist); }
      else if(p<120||p>900){ warn='⚠️ Allure incohérente détectée — vérifie le temps.'; }
    }
    if(dist&&$('#l_dist'))$('#l_dist').value=String(dist).replace('.',',');
    if(time&&$('#l_time'))$('#l_time').value=fmtHMS(time);
    if(st)st.innerHTML=`<div class="hint">${warn||((dist||time)?'✅ Valeurs détectées — vérifie et corrige si besoin.':'⚠️ Rien détecté, saisis les valeurs à la main.')}</div>`;
    $('#l_dist')?.dispatchEvent(new Event('input'));
  }catch(err){
    if(st)st.innerHTML='<div class="hint">⚠️ Lecture impossible (connexion requise la première fois). Saisis à la main.</div>';
  }
});

    const list=state.exos.filter(e=>e.cat===cat); if(!list.length)continue;
    exH+=`<div class="sec-t" style="margin-top:14px">${CATS[cat]}</div><div class="card" style="padding:6px 16px">`+
      list.map(e=>`<div class="item" onclick="editExo('${e.id}')">${zoneSVG(e.zone,'var(--acc)',26)}
        <div class="grow"><div class="it-name">${esc(e.name)}</div><div class="it-sub">${ZONES[e.zone]||''} · ${e.sets} × ${esc(e.reps)}</div></div>
        <span class="chev">›</span></div>`).join('')+'</div>';
  }

  $('#view').innerHTML=`
    <h1>Exercices</h1><div class="subh">Sports, programme & base de données</div>
    <div class="sec-t">Sports pratiqués</div>
    <div class="card" style="padding:6px 16px">${sportsH}</div>
    <button class="btn sec" onclick="editSport('')">＋ Ajouter un sport</button>
    <div class="sec-t">Programme hebdo récurrent</div>
    <div class="card" style="padding:6px 16px">${rulesH}</div>
    <button class="btn sec" onclick="addRuleForm('')">＋ Ajouter au programme</button>
    <div class="sec-t">Modèles de séances</div>
    <div class="card" style="padding:6px 16px">${tplH}</div>
    <button class="btn sec" onclick="editTemplate('')">＋ Nouveau modèle</button>
    <div class="sec-t">Exercices de salle</div>
    ${exH}
    <button class="btn sec" onclick="editExo('')">＋ Ajouter un exercice</button>
    <div class="sec-t">Données</div>
    <div class="card">
      <button class="btn sec" style="margin-top:0" onclick="exportJSON()">⬇️ Exporter JSON (sauvegarde)</button>
      <button class="btn sec" onclick="$('#importFile').click()">⬆️ Importer JSON</button>
    </div>`;
}

/* --- Sports & palette --- */
const PALETTE=['#FC4C02','#FF5A1F','#E24A3B','#E0338B','#B14BE0','#7C5CFF','#2E7CF6','#0FA3E0','#06B6D4','#0FBFA5','#1D9E75','#4CAF50','#8BC34A','#CDDC39','#EAB308','#F5A524','#EF7A27','#A9713B','#8D8D93','#5A5A60','#30323A','#111318'];
let tmpSport=null;
function editSport(id){
  const s=id?state.sports.find(x=>x.id===id):null;
  tmpSport=s?{...s}:{id:'',name:'',color:'#2E7CF6',active:true};
  renderSportForm();
}
function renderSportForm(){
  const t=tmpSport;
  openSheet(`<div class="sh-t">${t.id?'Modifier le sport':'Nouveau sport'}</div>
    <label class="f">Nom</label><input class="f" id="sp_name" value="${esc(t.name)}" placeholder="ex : Natation">
    <label class="f">Couleur</label>
    <button class="cbtn" onclick="openPalette()"><span class="dot" style="background:${t.color};width:20px;height:20px"></span>${t.color}</button>
    <label class="f">Actif</label>
    <select class="f" id="sp_act"><option value="1" ${t.active?'selected':''}>Oui</option><option value="0" ${!t.active?'selected':''}>Non</option></select>
    <button class="btn" onclick="saveSport()">Enregistrer</button>
    ${t.id&&!['s_run','s_muscu'].includes(t.id)?`<button class="btn dgr" onclick="deleteSport('${t.id}')">Supprimer ce sport</button>`:''}`);
}
function openPalette(){
  tmpSport.name=$('#sp_name')?.value??tmpSport.name;
  openSheet(`<div class="sh-t">Choisir une couleur</div>
    <div class="pal">${PALETTE.map(c=>`<button style="background:${c}" class="${c===tmpSport.color?'on':''}" onclick="pickColor('${c}')"></button>`).join('')}</div>
    <label class="f">Couleur personnalisée (palette complète)</label>
    <input class="f" type="color" value="${tmpSport.color}" style="height:52px;padding:4px" onchange="pickColor(this.value)">`);
}
function pickColor(c){ tmpSport.color=c; renderSportForm(); if($('#sp_name'))$('#sp_name').value=tmpSport.name; }
function saveSport(){
  tmpSport.name=$('#sp_name').value.trim(); if(!tmpSport.name)return toast('Donne un nom');
  tmpSport.active=$('#sp_act').value==='1';
  if(tmpSport.id){ Object.assign(state.sports.find(s=>s.id===tmpSport.id),tmpSport); }
  else{ tmpSport.id='s_'+uid(); state.sports.push(tmpSport); }
  save(); closeSheet(); render(); toast('Sport enregistré');
}
function deleteSport(id){ if(!confirm('Supprimer ce sport et ses séances planifiées ?'))return;
  state.sports=state.sports.filter(s=>s.id!==id);
  state.recurring=state.recurring.filter(r=>r.sportId!==id);
  state.oneoffs=state.oneoffs.filter(o=>o.sportId!==id);
  save(); closeSheet(); render(); }

/* --- Exercices --- */
function editExo(id){
  const e=id?exo(id):null;
  openSheet(`<div class="sh-t">${e?'Modifier':'Nouvel'} exercice</div>
    <label class="f">Nom</label><input class="f" id="ex_name" value="${esc(e?.name||'')}" placeholder="ex : Développé couché">
    <div class="frow">
      <div><label class="f">Catégorie</label>
      <select class="f" id="ex_cat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${e?.cat===k?'selected':''}>${v}</option>`).join('')}</select></div>
      <div><label class="f">Zone travaillée</label>
      <select class="f" id="ex_zone">${Object.entries(ZONES).map(([k,v])=>`<option value="${k}" ${e?.zone===k?'selected':''}>${v}</option>`).join('')}</select></div>
    </div>
    <div class="frow">
      <div><label class="f">Séries (défaut)</label><input class="f" id="ex_sets" type="number" value="${e?.sets??4}"></div>
      <div><label class="f">Répétitions (défaut)</label><input class="f" id="ex_reps" value="${esc(e?.reps||'8-10')}"></div>
    </div>
    <label class="f">Pictogramme du mouvement</label>
    <div class="row"><div class="grow"><select class="f" id="ex_picto" onchange="$('#pictoPrev').innerHTML=this.value?moveSVG(this.value,'var(--acc)',46):zoneSVG($('#ex_zone').value,'var(--acc)',34)">
      <option value="">— silhouette de la zone —</option>
      ${Object.entries(PICTOS).map(([k,v])=>`<option value="${k}" ${e?.picto===k?'selected':''}>${v}</option>`).join('')}
    </select></div>
    <div id="pictoPrev" style="flex:0 0 52px;text-align:center">${e?.picto?moveSVG(e.picto,'var(--acc)',46):zoneSVG(e?.zone||'pecs','var(--acc)',34)}</div></div>
    <label class="f">Description</label><textarea class="f" id="ex_desc">${esc(e?.desc||'')}</textarea>
    <button class="btn" onclick="saveExo('${id||''}')">Enregistrer</button>
    ${e?`<button class="btn dgr" onclick="deleteExo('${e.id}')">Supprimer</button>`:''}`);
}
function saveExo(id){
  const data={name:$('#ex_name').value.trim(),cat:$('#ex_cat').value,zone:$('#ex_zone').value,
    sets:Number($('#ex_sets').value)||3,reps:$('#ex_reps').value.trim()||'10',desc:$('#ex_desc').value.trim(),
    picto:$('#ex_picto').value||null};
  if(!data.name)return toast('Donne un nom');
  if(id)Object.assign(exo(id),data);
  else state.exos.push({id:'e_'+uid(),...data});
  save(); closeSheet(); render(); toast('Exercice enregistré');
}
function deleteExo(id){ if(!confirm('Supprimer cet exercice ? Il sera retiré des modèles.'))return;
  state.exos=state.exos.filter(e=>e.id!==id);
  state.templates.forEach(t=>t.exos=t.exos.filter(x=>x.exId!==id));
  save(); closeSheet(); render(); }

/* --- Modèles de séances --- */
let tmpTpl=null;
function editTemplate(id){
  const t=id?tplById(id):null;
  tmpTpl=t?JSON.parse(JSON.stringify(t)):{id:'',name:'',sportId:state.sports.find(s=>/muscu/i.test(s.name))?.id||state.sports[0].id,exos:[]};
  renderTplForm();
}
function renderTplForm(){
  const t=tmpTpl;
  const rows=t.exos.map((x,i)=>{const e=exo(x.exId);return `<div class="exo-l">
    <div class="grow"><div class="nm">${esc(e?.name||'?')}</div>
    <div class="frow" style="margin-top:6px">
      <div><input class="f" value="${x.sets}" type="number" onchange="tmpTpl.exos[${i}].sets=Number(this.value)||3" placeholder="Séries"></div>
      <div><input class="f" value="${esc(x.reps)}" onchange="tmpTpl.exos[${i}].reps=this.value" placeholder="Reps"></div>
    </div></div>
    <button class="btn sec sm" onclick="tmpTpl.exos.splice(${i},1);renderTplForm()">✕</button></div>`;}).join('');
  openSheet(`<div class="sh-t">${t.id?'Modifier le modèle':'Nouveau modèle'}</div>
    <label class="f">Nom</label><input class="f" id="tp_name" value="${esc(t.name)}" placeholder="ex : Push">
    <label class="f">Exercices</label>
    ${rows||'<div class="it-sub">Aucun exercice pour l\u2019instant.</div>'}
    <select class="f" style="margin-top:10px" id="tp_add" onchange="tplAddExo(this.value)">
      <option value="">＋ Ajouter un exercice…</option>
      ${['push','pull','legs','autre'].map(c=>{const l=state.exos.filter(e=>e.cat===c);return l.length?`<optgroup label="${CATS[c]}">${l.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</optgroup>`:''}).join('')}
    </select>
    <button class="btn" onclick="saveTpl()">Enregistrer</button>
    ${t.id?`<button class="btn dgr" onclick="deleteTpl('${t.id}')">Supprimer ce modèle</button>`:''}`);
}
function tplAddExo(exId){ if(!exId)return; const e=exo(exId);
  tmpTpl.name=$('#tp_name').value; tmpTpl.exos.push({exId,sets:e.sets,reps:e.reps}); renderTplForm(); }
function saveTpl(){
  tmpTpl.name=$('#tp_name').value.trim(); if(!tmpTpl.name)return toast('Donne un nom');
  if(tmpTpl.id)Object.assign(tplById(tmpTpl.id),tmpTpl);
  else{ tmpTpl.id='t_'+uid(); state.templates.push(tmpTpl); }
  save(); closeSheet(); render(); toast('Modèle enregistré');
}
function deleteTpl(id){ if(!confirm('Supprimer ce modèle ?'))return;
  state.templates=state.templates.filter(t=>t.id!==id);
  state.recurring.forEach(r=>{if(r.templateId===id)r.templateId=null});
  state.oneoffs.forEach(o=>{if(o.templateId===id)o.templateId=null});
  save(); closeSheet(); render(); }

/* ============ EXPORT / IMPORT ============ */
function exportJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`sport_sauvegarde_${todayISO()}.json`; a.click();
}
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(!d.sports||!d.exos)throw 0;
      state=d; save(); render(); toast('Données importées ✅');
    }catch(_){ toast('Fichier invalide'); } };
  r.readAsText(f); e.target.value='';
});

/* ============ SHEET ============ */
function openSheet(html){ $('#sheet').innerHTML=`<div class="grab"></div>${html}`; $('#sheetWrap').classList.remove('hidden'); }
function closeSheet(){ $('#sheetWrap').classList.add('hidden'); logCtx=null; }

render();
</script>
</body>
</html>
